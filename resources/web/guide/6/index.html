<!doctype html>
<html>
<head>
<meta charset="utf-8">

<body onLoad="OnInit()">
	
<div id="DownBlock">
	<div id="DownArea">
	<div id="DownText">
	    <div id="DownStepText" class="trans" tid="t71">Downloading</div>
		<button type="button" id="RetryBtn" onClick="RetryDownload()" aria-label="Retry download"></button>
    </div>
	<div>
		<div id="PercentTip"></div>
		<div id="PercentBkg"></div>
	</div>
	</div>
	
	<div id="DownSuccessTip" class="trans" tid="t73">Installation successful.</div>
	
	<div id="InstallFailedTip">
	    <div><a class="trans" tid="t79">Failed to install plug-in. </a><a class="trans" tid="t80">Try the following steps:</a></div>
	    <div class="bi-group"><a class="trans" tid="t81">1, Click </a><button type="button" class="trans LinkBtn" tid="t77" onClick="OpenPluginFolder()">here</button><a class="trans" tid="t82"> to open the plug-in directory</a> </div>
		<div class="trans" tid="t83">2, Close all open Bambu Studio</div>
		<div class="trans" tid="t84">3, Delete all files under the plug-in directory</div>
		<div class="trans" tid="t85">4, Reopen Bambu studio and install the plug-in again</div>
	</div>
	
	
</div>
	
<div id="BtnBlock">
	<button type="button" id="CancelBtn" class="trans Btn_Green" tid="t38" onClick="CancelDownload()">Cancel</button>
	<button type="button" id="RestartBtn" class="Btn_Green trans" tid="t25" onClick="RestartBambuStudio()">Finish</button>
	<button type="button" id="CloseBtn" class="Btn_Green trans" tid="t86" onClick="CloseDownDialog()">Close</button>
</div>
</body>
