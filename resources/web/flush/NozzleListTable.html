<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>喷嘴选择表格</title>
    <style>
      /*---Bundled design fonts-------------------------------------------------
        Ship Roboto with the app so this webview renders the MD3 type system
        regardless of which faces the host OS has installed. Paths are relative
        to this document (resources/web/flush/) and point at resources/fonts/,
        mirroring resources/web/homepage3/css/common.css. */
      @font-face {
        font-family: "Roboto";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("../../fonts/Roboto-Regular.ttf") format("truetype");
      }
      @font-face {
        font-family: "Roboto";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("../../fonts/Roboto-Medium.ttf") format("truetype");
      }

      /*---Material Design 3 color system---------------------------------------
        The same roles resources/web/homepage3/css/{common,dark}.css publish, so
        this popup resolves its chrome from the kit instead of a private palette.
        The host still drives the theme by toggling `darkmode` on <html> (it
        pushes the flag with every payload, see NozzleListTable::BuildTableObjStr)
        — but now that every rule below reads a token, dark mode is a palette
        swap rather than a second, hand-tuned design. */
      :root {
        color-scheme: light;
        --md-surface: #faf8fd;
        --md-sc-low: #f4f2f9;
        --md-sc-high: #e8e7ee;
        --md-on-surface: #1a1b1f;
        --md-on-surface-variant: #44464e;
        --md-outline-variant: #c5c6d0;
        --md-primary: #146c2e;
      }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: var(--md-surface);
        color: var(--md-on-surface);
        font-family: "Roboto", system-ui, "Segoe UI", "Helvetica Neue", sans-serif;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      html {
        overflow: hidden;
      }

      body {
        /* Let the user scroll when the webview is too short for the content
           (e.g. extreme Windows Accessibility text-size settings). */
        overflow-y: auto;
        overflow-x: auto;
      }

      table {
        border-collapse: collapse;
        width: 100%;
        max-width: 100%;
        /* MD3 body-medium: 14/20. */
        font-size: 14px;
        line-height: 20px;
        table-layout: fixed;
        margin: 0 auto;
        color: var(--md-on-surface);
        transition: color 0.3s ease;
        border: 1px solid var(--md-outline-variant); /* 表格外边框 */
      }

      th, td {
        padding: 10px;
        vertical-align: middle;
        transition: border-color 0.3s ease, background-color 0.3s ease;
        border: 1px solid var(--md-outline-variant); /* 所有单元格边框 */
      }

      th {
        text-align: center; /* 表头居中 */
        /* Roboto Medium — the kit's emphasis weight. The UA default for <th>
           is 700, heavier than anything in the MD3 type scale. */
        font-weight: 500;
      }

      td {
        text-align: center; /* 数据单元格居中对齐 */
        word-wrap: break-word;
      }

      thead th {
        background-color: var(--md-sc-high);
      }

      /* Zebra the body rows off the container tones. Striping used to exist
         only in the dark map, which is a large part of why the two themes read
         as two different tables; both now stripe from the same two roles. */
      tbody tr {
        background-color: var(--md-surface);
      }

      tbody tr:nth-child(even) {
        background-color: var(--md-sc-low);
      }

      /* The radio the native MD3 RadioBox draws (Widgets/RadioBox.cpp): a 2px
         ring in OnSurfaceVariant, ring plus a concentric dot in Primary when
         selected — not a disc flooded with brand green. `appearance: none`
         only suppresses the OS painting; this stays a real <input type="radio">
         so Tab/arrow-key navigation and the screen-reader radio role and
         checked state are unaffected. */
      input[type="radio"] {
        position: relative;
        box-sizing: border-box;
        width: 18px;
        height: 18px;
        margin-right: 8px;
        vertical-align: middle;
        appearance: none;
        -webkit-appearance: none;
        background-color: transparent;
        border: 2px solid var(--md-on-surface-variant);
        border-radius: 50%;
        cursor: pointer;
        transition: border-color 0.3s ease;
      }

      input[type="radio"]:checked {
        border-color: var(--md-primary);
      }

      input[type="radio"]:checked::after {
        content: '';
        position: absolute;
        width: 8px;
        height: 8px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background-color: var(--md-primary);
      }

      /* Keep the keyboard ring, but on-token: the UA default draws a system
         accent that belongs to neither theme. */
      input[type="radio"]:focus-visible {
        outline: 2px solid var(--md-primary);
        outline-offset: 2px;
      }

      label {
        cursor: pointer;
        color: inherit;
        vertical-align: middle;
        transition: color 0.3s ease;
      }

      .recommended {
        /* Primary at the kit's emphasis weight, rather than a second green
           that only ever managed ~2.8:1 on the light surface. */
        color: var(--md-primary);
        font-weight: 500;
      }

      /* 暗黑模式样式 — token overrides only; no rule above needs a dark twin. */
      html.darkmode {
        color-scheme: dark;
        --md-surface: #1b1c21;
        --md-sc-low: #202127;
        --md-sc-high: #2f3036;
        --md-on-surface: #e8e7ee;
        --md-on-surface-variant: #cdced8;
        --md-outline-variant: #4a4c54;
        --md-primary: #8bd89b;
      }
    </style>
  </head>
  <body>
    <table>
      <thead>
        <tr>
          <th id="nozzle-selection" rowspan="2">选用的喷嘴直径</th>
          <th id="available-nozzles"colspan="2">可用喷嘴</th>
        </tr>
        <tr>
          <th id="left-extruder">左边</th>
          <th id="right-extruder">右边</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr>
          <td>
            <input type="radio" name="nozzle" id="nozzle02" />
            <label for="nozzle02">0.2 mm</label>
          </td>
          <td>不可用</td>
          <td>2个</td>
        </tr>
        <tr>
          <td>
            <input type="radio" name="nozzle" id="nozzle04" checked />
            <label for="nozzle04">0.4 mm（推荐）</label>
          </td>
          <td>✔️</td>
          <td>3个</td>
        </tr>
        <tr>
          <td>
            <input type="radio" name="nozzle" id="nozzle06" />
            <label for="nozzle06">0.6 mm</label>
          </td>
          <td>不可用</td>
          <td>1个</td>
        </tr>
      </tbody>
    </table>

    <script>
      let highflow_label = 'high flow'
      let standard_label = 'standard'
      let language = 'en'

      window.addEventListener("DOMContentLoaded",function(){
        var data = JSON.stringify({
          msg: 'init',
        })
        window.nozzleListTable.postMessage(data);
      });

      function sendLayoutMessage() {
        const table = document.querySelector('table');
        // getBoundingClientRect() reflects CSS `zoom`, so the reported size
        // matches the visible pixels the webview needs on the C++ side.
        const rect = table.getBoundingClientRect();
        const tableWidth = Math.ceil(rect.width);
        const tableHeight = Math.ceil(rect.height);

        const layoutMsg = JSON.stringify({
          msg: 'layout',
          height:tableHeight,
          width: tableWidth
        });

        console.log('发送layout消息:', layoutMsg);
        window.nozzleListTable.postMessage(layoutMsg);
      }

      function initText(data){
        document.getElementById("nozzle-selection").innerText = data.nozzle_selection_label
        document.getElementById("available-nozzles").innerText = data.nozzle_list_label
        document.getElementById("left-extruder").innerText = data.left_label
        document.getElementById("right-extruder").innerText = data.right_label

        highflow_label = data.highflow_label
        standard_label = data.standard_label
        language =data.language
      }


      // Flip the MD3 token block between its light and dark values. The host
      // stamps `darkmode` onto every table payload, not just the first one, so
      // applying it on refresh as well keeps the webview in step with a theme
      // switch instead of stranding it on the palette it loaded with.
      function applyDarkMode(data) {
        if (!data || typeof data.darkmode !== 'boolean') return;
        document.documentElement.classList.toggle('darkmode', data.darkmode);
      }

      // 初始化表格
      function initTable(data) {
        applyDarkMode(data);
        updateTable(data);
        // 监听单选按钮变化，通知C++
        document.getElementById('tableBody').addEventListener('change', function(e) {
          if (e.target.type === 'radio' && e.target.name === 'nozzle') {
            const selectedIdx = e.target.getAttribute('data-index');
            // 通过wxWebView的消息机制发送给C++
            window.nozzleListTable.postMessage({
              msg: 'onSelect',
              index: parseInt(selectedIdx)
            });
          }
        });
      }

      // 更新表格内容的方法
      function updateTable(nozzleOptions) {
        console.log('更新表格数据：', nozzleOptions);
        applyDarkMode(nozzleOptions);
        const tableBody = document.getElementById('tableBody');
        // 清空现有内容
        tableBody.innerHTML = '';
        tabledata = nozzleOptions.data

        // 遍历所有喷嘴选项，生成表格行
        tabledata.forEach((option, index) => {
          const row = document.createElement('tr');

          // 喷嘴直径单元格（带单选按钮）
          const diameterCell = document.createElement('td');
          const radioId = `nozzle${index}`;

          // 构建单选按钮和标签
          let labelText = option.diameter +' mm';
          // 如果是推荐项，添加标识
          const isRecommended = false

          if (isRecommended) {
            labelText += '（推荐）';
          }

        diameterCell.innerHTML = `
        <input type="radio" name="nozzle" id="${radioId}" data-index="${index}" ${option.is_selected ? 'checked' : ''}>
        <label for="${radioId}" class="${isRecommended ? 'recommended' : ''}">${labelText}</label>
        `;

      const leftCell = document.createElement('td');
      const leftExtruder = option.extruders['0'] || { type: 'standard', count: 0 };
      leftCell.textContent = `${leftExtruder.count}${language === "zh-cn" ? "个" : ""}`;
      const rightCell = document.createElement('td');
      const rightExtruder = option.extruders['1'] || { type: 'standard', count: 0 };
      rightCell.textContent = `${rightExtruder.count}${language === "zh-cn" ? "个" : ""}`;

      // 添加单元格到行
      row.appendChild(diameterCell);
      row.appendChild(leftCell);
      row.appendChild(rightCell);
      
      // 添加行到表格
      tableBody.appendChild(row);
    });

    sendLayoutMessage()

    // Roboto is loaded with font-display: swap, so the first measurement above
    // can be taken against the fallback face. Re-report once the bundled face
    // has settled, otherwise the C++ side sizes the webview to metrics the
    // table no longer has and clips the last row.
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () { sendLayoutMessage(); });
    }
  }

</script>
</body>
</html>
