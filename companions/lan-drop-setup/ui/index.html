<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Bambu Studio LAN Drop Setup</title><link rel="stylesheet" href="style.css"></head>
<body><header><h1>Bambu Studio LAN Drop Setup</h1><small>Service 1.0.1 • Initial companion implementation</small><div class="settings"><label for="language">Language / 語言</label><select id="language"><option value="en">English</option><option value="yue">廣東話</option><option value="both">English / 廣東話</option></select><label for="theme">Theme / 外觀</label><select id="theme"><option value="light">Light / 淺色</option><option value="dark">Dark / 深色</option></select></div></header>
<main><h2 id="heading" tabindex="-1"></h2><p id="description"></p><div id="status" role="status" aria-live="polite"></div><section id="fields" hidden><label id="name-label" for="name"></label><input id="name" maxlength="80" value="Bambu Studio"><label id="port-label" for="port"></label><input id="port" type="number" min="1024" max="65535" value="8833"><p id="storage"></p><p id="credential"></p></section><section id="review" hidden></section><section id="result" hidden></section><p id="limitations"></p></main>
<footer><button id="back"></button><button id="cancel" hidden></button><span id="position"></span><button id="next"></button></footer><script src="renderer.js"></script></body></html>
