on:
  workflow_call:
    inputs:
      debug-symbols:
        required: false
        type: boolean
        default: false
      symbol-public-key:
        required: false
        type: string
        default: ''
      cache-key:
        required: true
        type: string
      cache-path:
        required: true
        type: string
      os:
        required: true
        type: string
      arch:
        required: false
        type: string

jobs:
  build_bambu:
    name: Build BambuStudio
    runs-on: ${{ inputs.os }}
    env:
      date:
      ver:
      ver_pure:

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: load cached deps
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ inputs.cache-key }}
          fail-on-cache-miss: true

      - name: Get the version and date on Windows
        if: inputs.os == 'windows-latest'
        run: |
          $date = Get-Date -Format 'yyyyMMdd'
          $ref = "${{ github.ref }}"
          $eventName = "${{ github.event_name }}"
          $prNumber = "${{ github.event.number }}"

          if ($eventName -eq 'pull_request') {
              $ver = "PR" + $prNumber
          } else {
              $versionContent = Get-Content version.inc -Raw
              if ($versionContent -match 'set\(SLIC3R_VERSION "(.*?)"\)') {
                  $ver = $matches[1]
              }
              $ver = "V$ver"
          }

          echo "ver=$ver" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          echo "date=$date" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          echo "date: ${{ env.date }} version: ${{ env.ver }}"
        shell: pwsh

  #   Mac
      - name: setup MSVC
        if: inputs.os == 'windows-latest'
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      # Ninja + sccache: the Visual Studio generator ignores compiler
      # launchers, so the app build runs under Ninja with cl.exe from this
      # dev environment; sccache then caches object files across runs via
      # the Actions cache (warm pushes skip most of the ~2 h compile).
      - name: Setup MSVC developer environment for Ninja
        if: inputs.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Setup sccache
        if: inputs.os == 'windows-latest'
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Install pkgconfig for the Windows build
        if: inputs.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dir "C:/Program Files (x86)/Windows Kits/10/Include"

          # Both packages fetch their payload from third-party hosts at install
          # time - pkgconfiglite from SourceForge, which returned a 404/timeout on
          # 2026-07-28 and failed the whole Windows build, blocking the release.
          # A transient outage on someone else's CDN must not be indistinguishable
          # from a broken commit, so each install gets bounded retries with a
          # backoff before the step is allowed to fail.
          function Install-ChocoPackage {
              param(
                  [Parameter(Mandatory)] [string] $Name,
                  [Parameter(Mandatory)] [string] $Version,
                  [int] $Attempts = 4
              )
              for ($attempt = 1; $attempt -le $Attempts; $attempt++) {
                  choco install $Name --version=$Version --yes --no-progress
                  if ($LASTEXITCODE -eq 0) {
                      Write-Host "::notice::$Name $Version installed on attempt $attempt."
                      return
                  }
                  if ($attempt -lt $Attempts) {
                      $delay = 15 * $attempt
                      Write-Host "::warning::$Name install attempt $attempt failed (exit $LASTEXITCODE); retrying in ${delay}s."
                      Start-Sleep -Seconds $delay
                  }
              }
              throw "$Name $Version could not be installed after $Attempts attempts."
          }

          Install-ChocoPackage -Name 'pkgconfiglite' -Version '0.28.0'

      # CMake compiles the English override and Hong Kong Cantonese catalogs
      # with Python while building (CMakeLists.txt, fork_catalogs), so the
      # interpreter must exist before configure.
      - name: Set up Python for the fork catalog compilation
        if: inputs.os == 'windows-latest'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      # sccache cannot cache a compile that uses the precompiled header ("Non-
      # cacheable: /Fp"), which is nearly every source, so every build compiled
      # them all. The Ninja tree of the latest main build, precompiled header
      # included, is restored from the draft build cache release instead, and
      # Ninja rebuilds only what changed since (docs/features/releases/
      # windows-release-supply-chain.md, Build cache). A missing, mismatched or
      # damaged cache only means a build from scratch, and a commit message
      # containing [cold build] asks for one.
      - name: Restore the build tree from the build cache release
        id: build_cache
        if: inputs.os == 'windows-latest' && !inputs.debug-symbols
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        run: >-
          ./scripts/ci/Restore-BuildCache.ps1
          -Repository '${{ github.repository }}'
          -Workspace '${{ github.workspace }}'
          -DependencyCacheKey '${{ inputs.cache-key }}'
          -Cold:$${{ contains(github.event.head_commit.message, '[cold build]') }}

      # The native converter compiles against the qpdf C API, and configure
      # stops unless LOCAL_CONVERTER_QPDF_SDK names the verified SDK. This
      # stages the hash-pinned official qpdf 12.4.2 SDK for configure and its
      # runtime into install-dir\tools\pdf, where the packaged converter worker
      # loads it. The job token reads the public release with gh; plain HTTPS
      # is the fallback, and either copy must match the pinned SHA-256. It runs
      # after the cache restore, which only ever writes the build directory.
      - name: Stage the verified qpdf SDK and PDF runtime
        if: inputs.os == 'windows-latest'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./scripts/windows/Install-LocalPdfTools.ps1
          -Destination '${{ github.workspace }}\install-dir\tools\pdf'
          -SdkDestination '${{ github.workspace }}\artifacts\local-pdf\sdk'
          -CacheDirectory '${{ github.workspace }}\artifacts\local-pdf-cache'

      - name: Build slicer Win
        id: build_win
        if: inputs.os == 'windows-latest'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        env:
          SCCACHE_GHA_ENABLED: 'true'
          DEBUG_SYMBOLS: ${{ inputs.debug-symbols }}
          SYMBOL_PUBLIC_KEY: ${{ inputs.symbol-public-key }}
        run: |
          $ErrorActionPreference = 'Stop'
          $symbolMode = $env:DEBUG_SYMBOLS -eq 'true'
          if ($symbolMode) {
              if ([string]::IsNullOrWhiteSpace($env:SYMBOL_PUBLIC_KEY)) { throw 'Symbol mode requires a public RSA PEM.' }
              if ($env:SYMBOL_PUBLIC_KEY.Trim() -notmatch '\A-----BEGIN PUBLIC KEY-----\s+[A-Za-z0-9+/=\s]+-----END PUBLIC KEY-----\z') { throw 'Only a public SPKI PEM is accepted.' }
              $rsa = [Security.Cryptography.RSA]::Create()
              try { $rsa.ImportFromPem($env:SYMBOL_PUBLIC_KEY); if ($rsa.KeySize -lt 3072) { throw 'RSA key must be at least 3072 bits.' } }
              finally { $rsa.Dispose() }
              $env:CL = ($env:CL + ' /FS').Trim()
              $env:SCCACHE_DISABLE = '1'
          }
          $pdbMode = if ($symbolMode) { 'ON' } else { 'OFF' }
          $configure = @(
            '-S', '.', '-B', 'build',
            '-G', 'Ninja',
            "-DSLIC3R_MSVC_PDB=$pdbMode",
            '-DBBL_RELEASE_TO_PUBLIC=1',
            '-DBBL_INTERNAL_TESTING=0',
            '-DSLIC3R_BUILD_TESTS=OFF',
            '-DCMAKE_PREFIX_PATH=${{ github.workspace }}\deps\build\BambuStudio_dep\usr\local',
            '-DCMAKE_INSTALL_PREFIX=${{ github.workspace }}\install-dir',
            '-DLOCAL_CONVERTER_QPDF_SDK:PATH=${{ github.workspace }}\artifacts\local-pdf\sdk',
            '-DCMAKE_BUILD_TYPE=Release',
            '-DWIN10SDK_PATH=C:/Program Files (x86)/Windows Kits/10/Include/10.0.22000.0'
          )
          if ($symbolMode) {
              $configure += @('-DCMAKE_C_COMPILER_LAUNCHER=', '-DCMAKE_CXX_COMPILER_LAUNCHER=')
          } else {
              $configure += @('-DCMAKE_C_COMPILER_LAUNCHER=sccache', '-DCMAKE_CXX_COMPILER_LAUNCHER=sccache')
          }
          cmake @configure 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/native-configure.log"
          # A restored tree that will not configure is dropped, never trusted:
          # the build goes on from scratch, as it would have without a cache.
          if ($LASTEXITCODE -ne 0 -and '${{ steps.build_cache.outputs.state }}' -eq 'warm') {
              Write-Host "::warning::Configuring the restored build tree failed with exit code $LASTEXITCODE; configuring from scratch."
              Remove-Item -LiteralPath build -Recurse -Force
              cmake @configure
          }
          if ($LASTEXITCODE -ne 0) {
              throw "Configuring the production Windows build failed with exit code $LASTEXITCODE."
          }

          cmake --build build --target device_page_build --config Release --parallel 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/native-device.log"
          if ($LASTEXITCODE -ne 0) {
              throw "Building DeviceWeb failed with exit code $LASTEXITCODE."
          }

          # -k 0 keeps Ninja compiling past a failed object, so one failed
          # run lists every compile error instead of only the first; a
          # failure still fails this step and nothing is installed.
          cmake --build build --target install --config Release --parallel -- -k 0 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/native-build.log"
          if ($LASTEXITCODE -ne 0) {
              throw "Building the production Windows installer payload failed with exit code $LASTEXITCODE."
          }

          # Stats from THIS step's server session — the post-job stats step
          # spawns a fresh server whose zeroed counters say nothing.
          sccache --show-stats

      - name: Retain sanitized native build diagnostics
        if: always() && inputs.os == 'windows-latest'
        continue-on-error: true
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'diagnostic/native-build'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          foreach ($name in @('native-configure.log', 'native-device.log', 'native-build.log')) {
              $path = Join-Path $env:RUNNER_TEMP $name
              if (Test-Path -LiteralPath $path) {
                  $text = [IO.File]::ReadAllText($path).Replace($env:GITHUB_WORKSPACE, '<workspace>').Replace($env:RUNNER_TEMP, '<runner-temp>')
                  [IO.File]::WriteAllText((Join-Path $out $name), $text)
              }
          }
          @{ source_sha = $env:GITHUB_SHA; run_id = $env:GITHUB_RUN_ID; job_status = '${{ job.status }}'; symbol_mode = '${{ inputs.debug-symbols }}' } | ConvertTo-Json | Set-Content (Join-Path $out 'run.json')

      - name: Upload native build diagnostics
        if: always() && inputs.os == 'windows-latest'
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostic/native-build/*
          if-no-files-found: warn
          retention-days: 7

      - name: Encrypt native crash symbols
        if: always() && inputs.os == 'windows-latest' && inputs.debug-symbols
        shell: pwsh
        env:
          SYMBOL_PUBLIC_KEY: ${{ inputs.symbol-public-key }}
        run: ./scripts/ci/Protect-NativeSymbols.ps1

      - name: Upload encrypted native crash symbols
        if: always() && inputs.os == 'windows-latest' && inputs.debug-symbols
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: encrypted-native-symbols-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostic/native-symbols/*
          if-no-files-found: warn
          retention-days: 7

      # Only main builds write the cache, so every build starts from main's
      # tree. The tree is archived and uploaded in parts of at most 1.5 GB in
      # the background while the payload is packaged; the last step waits.
      - name: Start saving the build tree to the build cache release
        if: inputs.os == 'windows-latest' && !inputs.debug-symbols && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP 'build-cache-save.log'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts\ci\Save-BuildCache.ps1'
          # Started hidden and without output redirection, and it writes its own
          # log: a child started with redirection inherits this step's output
          # pipe, and the runner kills whatever still holds it once the step ends.
          $process = Start-Process -FilePath pwsh -WindowStyle Hidden -PassThru `
            -ArgumentList @('-NoProfile', '-Command', "& '$script' *> '$log'")
          "BUILD_CACHE_SAVE_PID=$($process.Id)" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          Write-Host "Saving the build tree to the build cache release in the background (process $($process.Id))."

      # The build compiled and installed both fork catalogs (fork_catalogs in
      # CMakeLists.txt). Verify the installed Cantonese MO is byte-identical to
      # a fresh compile of this exact checkout before anything is packaged.
      - name: Verify installed Cantonese catalog
        if: inputs.os == 'windows-latest'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $catalog = Join-Path '${{ github.workspace }}\install-dir' 'resources\i18n\yue_HK\BambuStudio.mo'
          if (-not (Test-Path -LiteralPath $catalog -PathType Leaf)) {
              throw 'The build did not install the Cantonese catalog.'
          }
          python .\bbl\i18n\yue_HK\compile_translation.py --allow-unreferenced --output $catalog --check
          if ($LASTEXITCODE -ne 0) {
              throw "Verifying the installed Cantonese catalog failed with exit code $LASTEXITCODE."
          }
          $english = Join-Path '${{ github.workspace }}\install-dir' 'resources\i18n\en\BambuStudio.mo'
          python .\bbl\i18n\compile_catalog.py --po .\bbl\i18n\en\BambuStudio_en.po --output $english --check
          if ($LASTEXITCODE -ne 0) {
              throw "Verifying the installed English override catalog failed with exit code $LASTEXITCODE."
          }

      # The payload must start on a machine that has only Windows: every DLL
      # the launcher and BambuStudio.dll import, and every payload DLL they pull
      # in, is in the payload or is a Windows system DLL; the Visual C++ runtime
      # counts as payload. md3-v143 shipped without its OpenCascade, FFmpeg, GMP
      # and VC++ runtime DLLs, and its launcher exited with -1 before logging.
      - name: Verify the payload carries every DLL the app imports
        if: inputs.os == 'windows-latest'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .\scripts\ci\check_payload_imports.py '${{ github.workspace }}\install-dir'
          if ($LASTEXITCODE -ne 0) {
              throw "The payload is missing DLLs the app imports (exit $LASTEXITCODE)."
          }

      # Stage the Mesa llvmpipe software-OpenGL fallback into the payload's
      # mesa/ subfolder before SBOM generation, the portable zip, and Squirrel
      # packaging. The app copies these DLLs beside bambu-studio.exe and
      # relaunches itself when the host GPU driver offers no OpenGL >= 2.0
      # (see docs/features/windows/software-gl-fallback.md). The archive is a
      # hash-pinned upstream release: any content change fails the build.
      - name: Stage Mesa software OpenGL fallback payload
        if: inputs.os == 'windows-latest'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Pinned: pal1000/mesa-dist-win 26.1.3 (release-msvc, x64), published 2026-06-26.
          $mesaVersion = '26.1.3'
          $mesaUrl = "https://github.com/pal1000/mesa-dist-win/releases/download/$mesaVersion/mesa3d-$mesaVersion-release-msvc.7z"
          $mesaArchiveSha256 = '6dd431f4620cea73970b13e3ffa94f721f2a3924306b8a4283c97648cdb6eb9c'
          # Per-file pins of the two x64 DLLs actually shipped.
          $expectedFileHashes = @{
              'opengl32.dll'       = '12499866437a161d2b250d5105188ae00732dd74b4bebbcdf972e6145af00f9e'
              'libgallium_wgl.dll' = '1895f8c19ede5efd0497f9dfab463b19bf4377e3af7c06c2d4d073e4680c5f69'
          }

          $archive = Join-Path $env:RUNNER_TEMP "mesa3d-$mesaVersion-release-msvc.7z"
          Invoke-WebRequest -Uri $mesaUrl -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 15

          $actualArchiveHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualArchiveHash -ne $mesaArchiveSha256) {
              throw "Mesa archive SHA-256 mismatch: expected $mesaArchiveSha256, got $actualArchiveHash. Refusing to package an unverified OpenGL driver."
          }

          $extractDir = Join-Path $env:RUNNER_TEMP 'mesa3d-x64'
          & 'C:\Program Files\7-Zip\7z.exe' x $archive "-o$extractDir" 'x64\opengl32.dll' 'x64\libgallium_wgl.dll' -y
          if ($LASTEXITCODE -ne 0) {
              throw "Extracting the Mesa x64 DLLs failed with exit code $LASTEXITCODE."
          }

          $mesaPayloadDir = Join-Path '${{ github.workspace }}\install-dir' 'mesa'
          New-Item -ItemType Directory -Path $mesaPayloadDir -Force | Out-Null
          foreach ($name in @('opengl32.dll', 'libgallium_wgl.dll')) {
              $source = Join-Path (Join-Path $extractDir 'x64') $name
              if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
                  throw "The pinned Mesa archive did not contain x64\$name."
              }
              $actual = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actual -ne $expectedFileHashes[$name]) {
                  throw "Mesa $name SHA-256 mismatch: expected $($expectedFileHashes[$name]), got $actual."
              }
              Copy-Item -LiteralPath $source -Destination (Join-Path $mesaPayloadDir $name)
          }
          Write-Host "Staged Mesa $mesaVersion llvmpipe fallback DLLs into install-dir\mesa."

      - name: Stage verified Model Creator renderers
        if: inputs.os == 'windows-latest'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\windows\Stage-ModelCreatorRenderers.ps1 `
            -PayloadDirectory '${{ github.workspace }}\install-dir' `
            -CacheDirectory '${{ runner.temp }}\bambu-model-renderers'

      # Every release ships one-of-a-kind dim sum splash art: the payload copy
      # of splash_logo.svg is regenerated deterministically from the run
      # number, so identical run numbers reproduce identical art while every
      # new release gets a fresh scene. Only install-dir (the packaged
      # payload) is overwritten — the repository's default splash_logo.svg is
      # never touched. Runs after install-dir is populated and before the
      # SBOM/portable zip/installer steps so all of them carry the final art.
      - name: Compose unique dim sum splash art for this release
        if: inputs.os == 'windows-latest'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          .\scripts\ci\New-DimSumSplash.ps1 `
            -Seed ${{ github.run_number }} `
            -OutPath '${{ github.workspace }}\install-dir\resources\images\splash_logo.svg'

      - name: Set up automation SDK
        if: inputs.os == 'windows-latest'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'

      - name: Stage self-contained MCP and CLI companion
        if: inputs.os == 'windows-latest'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: ./scripts/windows/Stage-Automation.ps1 -PayloadDirectory '${{ github.workspace }}\install-dir'

      - name: Generate Windows payload SBOM
        if: inputs.os == 'windows-latest'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $versionContent = Get-Content version.inc -Raw
          if ($versionContent -notmatch 'set\(SLIC3R_VERSION "([^"]+)"\)') {
              throw 'Could not read SLIC3R_VERSION from version.inc.'
          }

          .\scripts\ci\New-WindowsCycloneDxSbom.ps1 `
            -PayloadDir '${{ github.workspace }}\install-dir' `
            -OutputPath '${{ github.workspace }}\BambuStudioMD3.cdx.json' `
            -Version $matches[1] `
            -Commit '${{ github.sha }}' `
            -Repository '${{ github.repository }}'


      - name: Pack app
        if: inputs.os == 'windows-latest'
        working-directory: ${{ github.workspace }}
        shell: cmd
        run: '"C:/Program Files/7-Zip/7z.exe" a -tzip BambuStudio_Windows_${{ env.ver }}_portable.zip ${{ github.workspace }}/install-dir'

      - name: Create Windows Squirrel installer
        if: inputs.os == 'windows-latest'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $versionContent = Get-Content version.inc -Raw
          if ($versionContent -notmatch 'set\(SLIC3R_VERSION "([^"]+)"\)') {
              throw 'Could not read SLIC3R_VERSION from version.inc.'
          }

          # Capture the product version now, before any later -match
          # overwrites the automatic $matches variable (hosted runs
          # 34148103919 and 34149103478 passed a tag number as the product
          # version and failed inside the packaging script).
          $productVersion = $matches[1]
          $sourceCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) {
              throw 'Could not read the source commit.'
          }

          # The Squirrel package version carries a build number
          # (major.minor.(patch*1000+N)) so a Squirrel feed can rank releases
          # whose version.inc has not moved. N is this workflow's run number,
          # which only grows in push order, and a build only becomes the latest
          # release when it is ahead of the latest one, so the update feed's
          # version always goes up. N used to be "highest existing md3-v tag
          # plus one", read here long before the release job assigns the tag:
          # builds that packaged while another one waited to publish got the
          # same number (md3-v155 and md3-v156 both shipped 2.8.4155), and
          # Squirrel installs nothing when the feed's version equals the
          # installed one. The md3-v<N> tag is still assigned by the release job.
          $releaseNumber = [int]'${{ github.run_number }}'
          if ($releaseNumber -le 0) {
              throw 'The workflow run number is not a positive integer.'
          }
          Write-Host "Squirrel package build number: $releaseNumber"

          & .\scripts\windows\Invoke-SquirrelPackage.ps1 `
            -PayloadDirectory '${{ github.workspace }}\install-dir' `
            -OutputDirectory '${{ github.workspace }}\artifacts\windows' `
            -ProductVersion $productVersion `
            -SourceCommit $sourceCommit `
            -Repository 'https://github.com/${{ github.repository }}.git' `
            -ReleaseNumber $releaseNumber `
            -IconPath '${{ github.workspace }}\resources\images\BambuStudio.ico'
          if ($LASTEXITCODE -ne 0) {
              throw "Squirrel.Windows packaging failed with exit code $LASTEXITCODE."
          }
          $squirrelDir = Join-Path '${{ github.workspace }}\artifacts\windows' 'squirrel'
          foreach ($required in @('Setup.exe', 'RELEASES', 'Setup.exe.sha256')) {
              if (-not (Test-Path -LiteralPath (Join-Path $squirrelDir $required) -PathType Leaf)) {
                  throw "Squirrel output is missing $required."
              }
          }
          $fullPackages = @(Get-ChildItem -LiteralPath $squirrelDir -File -Filter '*-full.nupkg')
          if ($fullPackages.Count -ne 1) {
              throw "Squirrel output must contain exactly one full package; found $($fullPackages.Count)."
          }

      - name: Validate Squirrel Windows package contract
        if: inputs.os == 'windows-latest'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $squirrelDir = Join-Path '${{ github.workspace }}\artifacts\windows' 'squirrel'
          $fullPackage = @(Get-ChildItem -LiteralPath $squirrelDir -File -Filter '*-full.nupkg')
          if ($fullPackage.Count -ne 1) {
              throw "Expected one Squirrel full package; found $($fullPackage.Count)."
          }
          & .\scripts\ci\Test-SquirrelWindowsPackage.ps1 `
            -Installer (Join-Path $squirrelDir 'Setup.exe') `
            -Releases (Join-Path $squirrelDir 'RELEASES') `
            -FullPackage $fullPackage[0].FullName `
            -Checksum (Join-Path $squirrelDir 'Setup.exe.sha256') `
            -Sbom '${{ github.workspace }}\BambuStudioMD3.cdx.json' `
            -SourceCommit '${{ github.sha }}' `
            -CiExecutionApproved
          $validatorSucceeded = $?
          if (-not $validatorSucceeded) {
              throw 'Squirrel package contract failed.'
          }

      # - name: Pack PDB
      #   if: inputs.os == 'windows-latest'
      #   working-directory: ${{ github.workspace }}/build/src/Release
      #   shell: cmd
      #   run: '"C:/Program Files/7-Zip/7z.exe" a -m0=lzma2 -mx9 Debug_PDB_${{ env.ver }}_for_developers_only.7z  *.pdb'

      - name: Upload artifacts Win zip
        if: always() && inputs.os == 'windows-latest'
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: BambuStudio_Windows_${{ env.ver }}_portable
          path: ${{ github.workspace }}/BambuStudio_Windows_${{ env.ver }}_portable.zip
          if-no-files-found: warn

      - name: Upload Windows installer
        if: always() && inputs.os == 'windows-latest'
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: BambuStudio_Windows_${{ env.ver }}_installer
          path: |
            ${{ github.workspace }}/artifacts/windows/squirrel/*
            ${{ github.workspace }}/BambuStudioMD3.cdx.json
          if-no-files-found: warn

      - name: Finish saving the build tree to the build cache release
        if: always() && inputs.os == 'windows-latest' && env.BUILD_CACHE_SAVE_PID != ''
        continue-on-error: true
        shell: pwsh
        run: |
          $process = Get-Process -Id ([int]$env:BUILD_CACHE_SAVE_PID) -ErrorAction SilentlyContinue
          if ($process) {
              $process | Wait-Process -Timeout 1800 -ErrorAction SilentlyContinue
              if (-not $process.HasExited) { Write-Host '::warning::Saving the build cache did not finish within 30 minutes.' }
          }
          $log = Join-Path $env:RUNNER_TEMP 'build-cache-save.log'
          if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log }
          else { Write-Host '::warning::The build cache save wrote no log.' }
