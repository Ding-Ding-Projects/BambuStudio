name: Deploy ui-md3 (MD3 redesign) to GitHub Pages

# Publishes the self-contained Material Design 3 web app in ui-md3/ to GitHub Pages,
# so the redesign has a live, always-current preview URL. The app is static (no build
# step): the ui-md3/ directory is uploaded verbatim and served at the site root.
#
# One-time setup on the fork: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". Then this workflow deploys on every push that touches ui-md3/.

on:
  push:
    branches: [md3-redesign, master, main]
    paths:
      - 'ui-md3/**'
      - '.github/workflows/ui-md3-pages.yml'
      # The static clipping contracts also assert against the native dialogs.
      - 'src/slic3r/GUI/SmartHomeDialog.*'
      - 'src/slic3r/GUI/MsgDialog.*'
  workflow_dispatch: {}

# Least-privilege token scoped to what deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; let a newer push supersede an older run.
concurrency:
  group: ui-md3-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Use the repository's runtime-test Node version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          # Auto-enable Pages (build type = GitHub Actions) using the pages:write token,
          # so no manual Settings -> Pages toggle is required on first run.
          enablement: true

      - name: Check the generated changelog is current
        run: node ui-md3/scripts/build-changelog.mjs --check

      - name: Compose site (landing page at root, app under /app)
        run: |
          # One composer, used identically here and on a development machine, so
          # a layout failure reproduces locally instead of only in CI.
          node ui-md3/scripts/compose-site.mjs _site
          node ui-md3/tests/assert-pages-layout.mjs _site
          echo "Composed _site:"; find _site -maxdepth 2 -type f | sort

      - name: Verify localization and clipping at runtime
        run: |
          node --test ui-md3/tests/i18n.test.mjs ui-md3/tests/site.test.mjs \
            ui-md3/tests/layout-clipping.test.mjs
          node ui-md3/tests/serve.mjs _site 4173 >/tmp/bambu-pages-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          server_ready=false
          for attempt in $(seq 1 50); do
            if curl --fail --silent --show-error \
                http://127.0.0.1:4173/index.html >/dev/null; then
              server_ready=true
              break
            fi
            sleep 0.1
          done
          if [ "$server_ready" != true ]; then
            echo "The bounded Pages preview server readiness check failed."
            cat /tmp/bambu-pages-http.log
            exit 1
          fi
          # 156 landing cases plus 288 per-tab cases; a single clipped element,
          # an undersized control or an empty panel fails the deploy.
          BAMBU_PAGES_TEST_URL=http://127.0.0.1:4173/index.html \
            node --test ui-md3/tests/runtime-layout-clipping.mjs

      - name: Upload composed site as the Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
