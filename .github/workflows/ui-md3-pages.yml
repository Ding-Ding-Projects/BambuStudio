name: Deploy ui-md3 (MD3 redesign) to GitHub Pages

# Publishes the Material Design 3 site to GitHub Pages. It is static — no build step —
# but it is not uploaded verbatim: scripts/compose-site.mjs assembles the published tree
# (landing site at the root, the interactive prototype under /app/, shared assets at both),
# and the same script runs locally, so what CI publishes is reproducible on a laptop.
#
# One-time setup on the fork: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". Then this workflow deploys on every push that touches ui-md3/.

on:
  push:
    branches: [md3-redesign, master, main]
    paths:
      - 'ui-md3/**'
      - '.github/workflows/ui-md3-pages.yml'
      # The static clipping contracts also assert against the native dialogs.
      - 'src/slic3r/GUI/SmartHomeDialog.*'
      - 'src/slic3r/GUI/MsgDialog.*'
  # A published release changes what the changelog should say, and the changelog is
  # regenerated at deploy time — so a release redeploys the site. It cannot deploy
  # from here directly: see the redeploy-on-release job for why.
  release:
    types: [published]
  workflow_dispatch: {}

# Least-privilege token scoped to what deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; let a newer push supersede an older run.
#
# A release run is a dispatcher, not a deploy, so it gets its own group. Sharing
# one would let a release cancel a deploy that was midway through real work and
# then, if no PAT is configured, dispatch nothing in its place — trading a
# running deploy for none at all.
concurrency:
  group: ui-md3-pages-${{ github.event_name == 'release' && 'dispatch' || 'deploy' }}
  cancel-in-progress: true

jobs:
  # A release fires this workflow at the tag ref (md3-v57), not at master. The
  # github-pages environment accepts deployments only from master, so it rejects a
  # tag-ref run before its first step runs — a three-second failure with no steps and
  # no log, which is why this went unnoticed: 12 release runs, 12 red X's, and the
  # changelog refresh they were supposed to perform never once happened.
  #
  # So re-enter through the front door: dispatch this same workflow on master, which
  # then deploys normally and regenerates the changelog with the new release in it.
  # This cannot loop — the dispatched run arrives as workflow_dispatch, and nothing
  # in this workflow publishes a release.
  redeploy-on-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Redeploy from master so the changelog picks up this release
        env:
          # GITHUB_TOKEN is deliberately absent: GitHub blocks runs triggered by it
          # from triggering further runs, so a dispatch signed with it would return
          # 204 and silently do nothing. This needs a real PAT or it needs to say so.
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB || secrets.RELEASE_TOKEN || secrets.ORG_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::No PAT configured (TOKEN_GITHUB/RELEASE_TOKEN/ORG_TOKEN)." \
                 "The site will list this release after the next push instead."
            exit 0
          fi
          gh workflow run ui-md3-pages.yml --repo "${GITHUB_REPOSITORY}" --ref master
          echo "Dispatched a master-ref Pages deploy for ${GITHUB_REF_NAME}."

  deploy:
    # Never on a release: the environment would refuse it. redeploy-on-release
    # dispatches a master-ref run, and that run lands here as workflow_dispatch.
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The changelog generator reads the commits between release tags.
          fetch-depth: 0

      - name: Use the repository's runtime-test Node version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          # Auto-enable Pages (build type = GitHub Actions) using the pages:write token,
          # so no manual Settings -> Pages toggle is required on first run.
          enablement: true

      - name: Refresh the changelog from the published releases
        # Regenerated at deploy time so the site lists every release, including
        # the ones this repository published after the file was last committed.
        # A gate on staleness would be self-defeating: every release CI publishes
        # would block the next Pages deploy until someone regenerated by hand.
        # The committed file is the fallback, so an API outage costs freshness,
        # not the deploy.
        continue-on-error: true
        env:
          # TOKEN_GITHUB is the owner PAT this repository actually has; the others
          # are the org-standard names, kept so the chain still resolves elsewhere.
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB || secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: node ui-md3/scripts/build-changelog.mjs

      - name: Compose site (landing page at root, app under /app)
        run: |
          # One composer, used identically here and on a development machine, so
          # a layout failure reproduces locally instead of only in CI.
          # index.html is generated from app/screens/*.template.html; a tree where the
          # two disagree ships a prototype nobody reviewed.
          node ui-md3/scripts/assemble-index.mjs --check
          node ui-md3/scripts/compose-site.mjs _site
          node ui-md3/tests/assert-pages-layout.mjs _site
          echo "Composed _site:"; find _site -maxdepth 2 -type f | sort

      - name: Verify localization and clipping at runtime
        run: |
          node --test ui-md3/tests/i18n.test.mjs ui-md3/tests/site.test.mjs \
            ui-md3/tests/site-behaviour.test.mjs ui-md3/tests/layout-clipping.test.mjs
          node ui-md3/tests/serve.mjs _site 4173 >/tmp/bambu-pages-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          server_ready=false
          for attempt in $(seq 1 50); do
            if curl --fail --silent --show-error \
                http://127.0.0.1:4173/index.html >/dev/null; then
              server_ready=true
              break
            fi
            sleep 0.1
          done
          if [ "$server_ready" != true ]; then
            echo "The bounded Pages preview server readiness check failed."
            cat /tmp/bambu-pages-http.log
            exit 1
          fi
          # 156 landing cases plus 288 per-tab cases; a single clipped element,
          # an undersized control or an empty panel fails the deploy.
          BAMBU_PAGES_TEST_URL=http://127.0.0.1:4173/index.html \
            node --test ui-md3/tests/runtime-layout-clipping.mjs

      - name: Upload composed site as the Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
