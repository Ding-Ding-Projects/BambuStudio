name: Windows build and release

on:
  push:
    # Branch pushes only. A bare `push: {}` also matches the tag that the
    # release job itself creates, so every release re-triggered a build of the
    # same commit and published another (mis-titled) release — an unbounded
    # release loop (r94..r192 were all echoes of a handful of commits).
    branches: ['**']

  pull_request:
    branches: [main]

  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  classify_changes:
    name: Classify code changes
    runs-on: windows-latest
    outputs:
      code_changed: ${{ steps.classify.outputs.code_changed }}
    steps:
      - name: Classify push paths
        id: classify
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_DELETED: ${{ github.event.deleted }}
          BEFORE_SHA: ${{ github.event.before }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $ErrorActionPreference = 'Stop'
          $codeChanged = $true
          if ($env:EVENT_NAME -eq 'push') {
              if ($env:EVENT_DELETED -eq 'true') {
                  $codeChanged = $false
              } elseif ($env:REF_TYPE -ne 'tag' -and
                        $env:BEFORE_SHA -match '^[0-9a-f]{40}$' -and
                        $env:BEFORE_SHA -ne ('0' * 40)) {
                  $headers = @{
                      Accept                  = 'application/vnd.github+json'
                      Authorization           = "Bearer $env:GH_TOKEN"
                      'X-GitHub-Api-Version' = '2026-03-10'
                      'User-Agent'            = 'BambuStudio-Windows-change-classifier'
                  }
                  $comparison = Invoke-RestMethod `
                    -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/compare/$env:BEFORE_SHA...$env:GITHUB_SHA" `
                    -Headers $headers `
                    -Method Get
                  $changedPaths = @($comparison.files | ForEach-Object { $_.filename; $_.previous_filename } |
                      Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Sort-Object -Unique)
                  $nonMarkdownPaths = @($changedPaths | Where-Object { $_ -notmatch '(?i)\.md$' })
                  # GitHub caps compare-file metadata at 300 entries. At that
                  # boundary, fail toward a full build because later files may
                  # contain code.
                  $codeChanged = $nonMarkdownPaths.Count -gt 0 -or @($comparison.files).Count -ge 300
                  if (-not $codeChanged) {
                      Write-Host 'Only Markdown evidence/documentation changed; classification is informational and the required build/release policy still runs.'
                  }
              }
          }
          "code_changed=$($codeChanged.ToString().ToLowerInvariant())" | Out-File `
            -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8

  build_windows:
    name: Build Windows
    needs: classify_changes
    # User mandate 2026-07-24: CI runs are never skipped — every push builds
    # and releases, Markdown-only or not. The classifier still runs (its
    # output is informational in the logs) but no longer gates the build.
    if: ${{ always() }}
    # No supersede group: every push's build runs to completion. Superseding
    # used to cancel in-flight builds, which repeatedly threw away 90-minute
    # compiles (and their would-be releases and caches) during push trains.
    # Release tags are unique per run, so parallel runs cannot collide.
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: windows-latest
      build-deps-only: false

  release_windows:
    name: Publish Windows release
    # ref_type guard is redundant with the branches-only push trigger above but
    # keeps the release loop impossible even if the trigger is later widened.
    if: ${{ github.event_name != 'pull_request' && github.ref_type != 'tag' }}
    needs: build_windows
    runs-on: windows-latest
    concurrency:
      group: windows-release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download installer artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: BambuStudio_Windows_*_installer
          path: release
          merge-multiple: true

      - name: Validate Squirrel release assets and prepare metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          function Get-Sha256Lower {
              param([Parameter(Mandatory)][string] $Path)
              $stream = [System.IO.File]::OpenRead($Path)
              try {
                  $sha256 = [System.Security.Cryptography.SHA256]::Create()
                  try { return ([System.BitConverter]::ToString($sha256.ComputeHash($stream))).Replace('-', '').ToLowerInvariant() }
                  finally { $sha256.Dispose() }
              }
              finally { $stream.Dispose() }
          }
          $installers = @(Get-ChildItem release -Recurse -File -Filter 'Setup.exe')
          if ($installers.Count -ne 1) { throw "Expected exactly one Squirrel Setup.exe, found $($installers.Count)." }
          $releases = @(Get-ChildItem release -Recurse -File -Filter 'RELEASES')
          if ($releases.Count -ne 1) { throw "Expected exactly one Squirrel RELEASES index, found $($releases.Count)." }
          $fullPackages = @(Get-ChildItem release -Recurse -File | Where-Object { $_.Name -like '*-full.nupkg' })
          if ($fullPackages.Count -ne 1) { throw "Expected exactly one Squirrel full package, found $($fullPackages.Count)." }
          $sboms = @(Get-ChildItem release -Recurse -File -Filter 'BambuStudioMD3.cdx.json')
          if ($sboms.Count -ne 1) { throw "Expected exactly one BambuStudioMD3.cdx.json, found $($sboms.Count)." }
          $installer = $installers[0]
          $releaseIndex = $releases[0]
          $fullPackage = $fullPackages[0]
          $sbom = $sboms[0]
          $checksumPath = Join-Path $installer.DirectoryName 'Setup.exe.sha256'
          if (-not (Test-Path -LiteralPath $checksumPath -PathType Leaf)) { throw 'Squirrel Setup.exe.sha256 is missing.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'NotSigned') { throw "Squirrel Setup.exe is not unsigned; Authenticode status is '$($signature.Status)'." }
          $installerHash = Get-Sha256Lower -Path $installer.FullName
          if ((Get-Content -LiteralPath $checksumPath -Raw).Trim() -cne "$installerHash *Setup.exe") { throw 'Squirrel Setup.exe checksum does not match.' }
          $releaseText = Get-Content -LiteralPath $releaseIndex.FullName -Raw
          if ($releaseText -notmatch [regex]::Escape($fullPackage.Name)) { throw 'RELEASES does not reference the full package.' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($fullPackage.FullName)
          try {
              $appEntry = @($archive.Entries | Where-Object {
                  $_.FullName.Replace('\', '/').TrimStart('/') -ieq 'lib/net45/bambu-studio.exe'
              })
              if ($appEntry.Count -ne 1 -or $appEntry[0].Length -le 0) { throw 'Squirrel full package is missing lib/net45/bambu-studio.exe.' }
              $nuspecEntry = @($archive.Entries | Where-Object { $_.FullName -like '*.nuspec' })
              if ($nuspecEntry.Count -ne 1) { throw 'Squirrel full package must contain exactly one nuspec.' }
              $reader = New-Object System.IO.StreamReader($nuspecEntry[0].Open())
              try { $nuspecText = $reader.ReadToEnd() } finally { $reader.Dispose() }
              if ($nuspecText -notmatch [regex]::Escape($env:GITHUB_SHA)) { throw 'Squirrel nuspec does not carry the exact workflow commit.' }
          } finally { $archive.Dispose() }
          if ($sbom.Length -gt 16MB) { throw "The downloaded SBOM is $($sbom.Length) bytes, above the 16 MiB attestation limit." }
          $sbomDocument = Get-Content -LiteralPath $sbom.FullName -Raw | ConvertFrom-Json
          if ($sbomDocument.bomFormat -ne 'CycloneDX' -or $sbomDocument.specVersion -ne '1.6') { throw 'The downloaded SBOM is not a CycloneDX 1.6 document.' }
          if (@($sbomDocument.components).Count -lt 1000) { throw "The downloaded SBOM contains only $(@($sbomDocument.components).Count) components." }
          $versionContent = Get-Content version.inc -Raw
          if ($versionContent -notmatch 'set\(SLIC3R_VERSION "([^"]+)"\)') { throw 'Could not read SLIC3R_VERSION from version.inc.' }
          $version = $matches[1]
          $components = @($sbomDocument.components)
          $componentNames = @($components | ForEach-Object { $_.name })
          if (($componentNames | Sort-Object -Unique).Count -ne $componentNames.Count) { throw 'The downloaded SBOM contains duplicate component names.' }
          if ($componentNames -notcontains 'bambu-studio.exe') { throw 'The downloaded SBOM does not contain bambu-studio.exe.' }
          foreach ($component in $components) {
              $sha256 = @($component.hashes | Where-Object { $_.alg -eq 'SHA-256' })
              if ($sha256.Count -ne 1 -or $sha256[0].content -notmatch '^[0-9a-f]{64}$') { throw "SBOM component '$($component.name)' lacks one valid lowercase SHA-256 hash." }
          }
          if ($sbomDocument.metadata.component.version -ne $version) { throw "SBOM version '$($sbomDocument.metadata.component.version)' does not match '$version'." }
          $expectedBomRef = "pkg:github/$env:GITHUB_REPOSITORY@$env:GITHUB_SHA"
          if ($sbomDocument.metadata.component.'bom-ref' -cne $expectedBomRef) { throw "SBOM source identity '$($sbomDocument.metadata.component.'bom-ref')' does not match '$expectedBomRef'." }
          $expectedSourceUrl = "https://github.com/$env:GITHUB_REPOSITORY/tree/$env:GITHUB_SHA"
          $sourceUrls = @($sbomDocument.metadata.component.externalReferences | ForEach-Object { $_.url })
          if ($sourceUrls -notcontains $expectedSourceUrl) { throw "SBOM does not bind itself to '$expectedSourceUrl'." }
          $tag = "md3-windows-v$version-r${{ github.run_number }}"
          "release_tag=$tag" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "release_version=$version" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "installer_path=$($installer.FullName)" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "checksum_path=$checksumPath" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "releases_path=$($releaseIndex.FullName)" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "full_package_path=$($fullPackage.FullName)" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "sbom_path=$($sbom.FullName)" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          $lineCountPath = Join-Path $env:GITHUB_WORKSPACE 'release-line-count.md'
          & pwsh -NoLogo -NoProfile -File (Join-Path $env:GITHUB_WORKSPACE 'scripts\ci\Measure-LineCount.ps1') -Root $env:GITHUB_WORKSPACE -OutputMarkdown $lineCountPath
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $lineCountPath -PathType Leaf)) { throw 'The committed line-count script did not produce release-line-count.md.' }
          "line_count_path=$lineCountPath" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Attest Windows installer provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: ${{ env.installer_path }}

      - name: Attest Windows installer SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: ${{ env.installer_path }}
          sbom-path: ${{ env.sbom_path }}

      - name: Publish uniquely tagged Windows release
        shell: pwsh
        env:
          # The github-actions integration started receiving HTTP 403 on release
          # creation (org-side restriction, 2026-07-22) even with contents: write;
          # TOKEN_GITHUB is an owner PAT that publishes on its behalf. Falls back
          # to the workflow token where the secret is absent (e.g. forks).
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB || github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Sequential single-number releases with a unique codename each.
          # The release job is serialized by its non-cancelling concurrency
          # group, so counting existing md3-v<N> tags here is race-safe.
          $maxN = 0
          $page = & gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          foreach ($r in $page) {
              if ($r.tag_name -match '^md3-v(\d+)$') {
                  $n = [int]$Matches[1]
                  if ($n -gt $maxN) { $maxN = $n }
              }
