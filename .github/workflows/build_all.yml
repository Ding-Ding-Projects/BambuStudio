name: Legacy upstream build (disabled for official baseline)

# The inherited cross-platform matrix is intentionally inactive while the
# official Windows baseline is established. Its reusable workflows remain
# available for later review; this file does not run on a branch push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inactive:
    if: false
    runs-on: windows-2025
    steps:
      - run: Write-Host 'Use official-windows-baseline.yml for this diagnostic branch.'
