name: Official portable runtime comparison

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-portable-comparison-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  compare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 55
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out comparison code and public fixture
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Compare official published portable build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/ci/Invoke-OfficialRuntimeBaseline.ps1

      - name: Upload safe comparison metadata
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: official-portable-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostic/official-runtime/*.json
          if-no-files-found: warn
          retention-days: 7
