name: Official Windows baseline diagnostic

on:
  push:
    branches:
      - codex/official-native-reapply
    paths:
      - '.github/workflows/official-windows-baseline.yml'
      - 'scripts/ci/Invoke-OfficialBaseline.ps1'
      - 'deps/**'
      - 'src/**'
      - 'resources/**'
      - 'CMakeLists.txt'
      - 'version.inc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-windows-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/codex/official-native-reapply'
    runs-on: windows-2025
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Restore official dependency build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: deps/build/BambuStudio_dep
          key: official-windows-2025-vs2026-release-deps-${{ hashFiles('deps/**') }}

      - name: Build official native baseline
        run: ./scripts/ci/Invoke-OfficialBaseline.ps1

      - name: Collect diagnostic outputs
        if: ${{ always() }}
        continue-on-error: true
        run: |
          $out = Join-Path $PWD 'diagnostic'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $meta = [ordered]@{
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            source_sha = $env:GITHUB_SHA
            ref = $env:GITHUB_REF
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            job_status = '${{ job.status }}'
          }
          $meta | ConvertTo-Json | Set-Content (Join-Path $out 'run.json')
          if (Test-Path 'install-dir') {
            Compress-Archive -Path 'install-dir/*' -DestinationPath (Join-Path $out 'official-native-portable.zip') -Force
          }
          $pdbs = @(Get-ChildItem -Path build -Filter '*.pdb' -File -Recurse -ErrorAction SilentlyContinue)
          if ($pdbs.Count) {
            $symbols = Join-Path $out 'symbols'
            New-Item -ItemType Directory -Force -Path $symbols | Out-Null
            foreach ($pdb in $pdbs) { Copy-Item -LiteralPath $pdb.FullName -Destination (Join-Path $symbols $pdb.Name) -Force }
          }

      - name: Upload diagnostic outputs
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: official-windows-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostic/
          if-no-files-found: warn
          retention-days: 7
