name: Verify packaged automation runtime
on:
  push:
    branches:
      - feature/mcp-integration
    paths:
      - .github/workflows/mcp-runtime.yml
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable md3-vN release tag
        required: true
        type: string
      expected_source_commit:
        description: Exact released source SHA, including this verifier
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  runtime:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_SHA: ${{ inputs.expected_source_commit }}
    steps:
      - name: Validate dispatch identities
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^md3-v\d+$' -or $env:SOURCE_SHA -cnotmatch '^[0-9a-f]{40}$') {
            throw 'An immutable release tag and lowercase full source SHA are required.'
          }
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.expected_source_commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Parse automation evidence sources
        shell: pwsh
        run: |
          foreach ($path in @('scripts/ci/Verify-HostedAutomation.ps1', 'scripts/md3/Open-HostedAutomationEvidence.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw 'Automation evidence source parsing failed.' }
          }
      - name: Verify installed packaged automation
        shell: pwsh
        run: |
          & scripts/ci/Verify-HostedAutomation.ps1 -Tag $env:RELEASE_TAG -ExpectedSourceCommit $env:SOURCE_SHA -Repository $env:GITHUB_REPOSITORY -OutputDirectory "$env:RUNNER_TEMP/automation-safe"
      - name: Retain safe receipt and encrypted diagnostics
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: automation-runtime-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/automation-safe/receipt.json
            ${{ runner.temp }}/automation-safe/evidence.aesgcm
            ${{ runner.temp }}/automation-safe/envelope.json
          if-no-files-found: warn
          retention-days: 7
