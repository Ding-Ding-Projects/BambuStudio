name: Trace published startup on hosted Windows

on:
  push:
    branches: [codex/hosted-startup-stack, feature/ui-integration]
    paths:
      - '.github/workflows/trace-release-startup.yml'
      - 'scripts/ci/Trace-HostedReleaseStartup.ps1'
      - 'scripts/md3/trace-packaged-startup.py'
      - 'scripts/md3/test-trace-packaged-startup.py'
  workflow_dispatch:
    inputs:
      contract_only:
        description: Validate diagnostic contracts without installation or debugging
        type: boolean
        default: false
      from_creation:
        description: Fixed v190 loader diagnosis from process creation
        type: boolean
        default: false
      tag:
        description: Published release tag
        required: true
        default: md3-v125
      source_commit:
        description: Exact published source commit
        required: true
        default: c5df6199e1a83b1c94be12e999c0b322fded8730

permissions:
  contents: read

concurrency:
  group: hosted-startup-trace-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'workflow_dispatch' && inputs.contract_only
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Check fixed creation contracts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows') { throw 'Hosted Windows is required.' }
          $source=git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $source -cne $env:GITHUB_SHA) { throw 'Source identity mismatch.' }
          New-Item -ItemType Directory -Force diagnostic/contract | Out-Null
          $receipt=@{schema=1;source_commit=$source;run_id=$env:GITHUB_RUN_ID;status='failed';python_cases=9;desktop_rejections=0;actual_absence_verified=$false;product_started=$false;files=@{}}
          foreach ($path in @('scripts/md3/trace-packaged-startup.py','scripts/md3/test-trace-packaged-startup.py','scripts/md3/startup_desktop_holder.py','scripts/ci/HostedScaleProcess.cs')) {
            $receipt.files[$path]=(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          try {
            python -m pip install --disable-pip-version-check --quiet --timeout 15 --retries 1 'Pillow==11.3.0'
            if ($LASTEXITCODE -ne 0) { throw 'Pinned contract import dependency is unavailable.' }
            python scripts/md3/test-trace-packaged-startup.py
            if ($LASTEXITCODE -ne 0) { throw 'Python contract failed.' }
            Add-Type -Path scripts/ci/HostedScaleProcess.cs
            $name='Local\BambuNativeScale-' + ('a' * 64)
            foreach ($desktop in @('WinSta0\Default','WinSta0\startup-loader-x-1','Other\startup-loader-1-1','WinSta0\startup-loader-1-1 extra')) {
              $result=[HostedScaleProcess]::RunNamedOnDesktop('not-launched.exe',@(),1,$false,$name,$desktop)
              if (-not $result.Terminated -or $result.ProcessStage -ne [HostedScaleProcess+Stage]::InvalidName) { throw 'Invalid desktop contract failed.' }
              $receipt.desktop_rejections++
            }
            $toolRoot=Join-Path $env:RUNNER_TEMP 'startup-contract-lowlevel'
            git clone --quiet --no-checkout https://github.com/Ding-Ding-Projects/lowlevel-computer-use-mcp.git $toolRoot
            if ($LASTEXITCODE -ne 0) { throw 'Pinned tool fetch failed.' }
            git -C $toolRoot checkout --quiet --detach e6e42f2066d539256d6480401d7cef867f2b8dfe
            if ($LASTEXITCODE -ne 0 -or (git -C $toolRoot rev-parse HEAD) -cne 'e6e42f2066d539256d6480401d7cef867f2b8dfe') { throw 'Pinned tool identity mismatch.' }
            python -m pip install --disable-pip-version-check --quiet --timeout 15 --retries 1 $toolRoot
            if ($LASTEXITCODE -ne 0) { throw 'Pinned tool unavailable.' }
            $env:LLCU_CHEAP=(Get-Command lowlevel-computer-use-cheap -CommandType Application).Path
            $python=(Get-Command python -CommandType Application).Path
            $actual=[HostedScaleProcess]::Run($python,[string[]]@('scripts/md3/startup_desktop_holder.py','--absence-contract'),15,$false)
            if (-not $actual.Terminated -or $actual.Code -ne 0) { throw 'Actual pinned desktop absence contract failed.' }
            $receipt.actual_absence_verified=$true
            $nonce=[Guid]::NewGuid().ToString('N')
            $holderRoot=Join-Path $env:RUNNER_TEMP ('startup-contract-' + $nonce)
            New-Item -ItemType Directory -Path $holderRoot | Out-Null
            $holderName='Local\BambuNativeScale-' + [Convert]::ToHexString([Security.Cryptography.RandomNumberGenerator]::GetBytes(32)).ToLowerInvariant()
            $holderArgs=[string[]]@('scripts/md3/startup_desktop_holder.py','--root',$holderRoot,'--nonce',$nonce,
              '--desktop',"startup-loader-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)",'--source',$source,'--job-name',$holderName,'--lifecycle-contract')
            $lifecycle=[HostedScaleProcess]::RunNamed($python,$holderArgs,60,$false,$holderName)
            if (-not $lifecycle.Terminated -or $lifecycle.Code -ne 0) { throw 'Persistent desktop lifecycle contract failed.' }
            $receipt.persistent_lifecycle_verified=$true
            $receipt.status='passed'
          } finally {
            $receipt | ConvertTo-Json -Depth 5 | Set-Content diagnostic/contract/receipt.json -Encoding utf8
          }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: startup-creation-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostic/contract/receipt.json
          if-no-files-found: warn
  trace:
    if: (github.ref == 'refs/heads/codex/hosted-startup-stack' || (github.event_name == 'workflow_dispatch' && inputs.from_creation)) && !inputs.contract_only
    runs-on: windows-2025
    timeout-minutes: ${{ inputs.from_creation && 25 || 90 }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out exact verifier commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Parse hosted diagnostic PowerShell
        run: |
          $paths = @('scripts/ci/Trace-HostedReleaseStartup.ps1',
                     'scripts/ci/Verify-HostedSquirrelInstall.ps1',
                     'scripts/md3/Capture-HostedReleaseGui.ps1')
          foreach ($path in $paths) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $path), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -ne 0) { throw "PowerShell parse failed: $path" }
          }

      - name: Trace exact installed release process
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || github.token }}
          TRACE_TAG: ${{ inputs.tag || 'md3-v125' }}
          TRACE_SOURCE_COMMIT: ${{ inputs.source_commit || 'c5df6199e1a83b1c94be12e999c0b322fded8730' }}
          TRACE_FROM_CREATION: ${{ inputs.from_creation }}
        run: |
          $arguments = @{Tag=$env:TRACE_TAG; ExpectedCommit=$env:TRACE_SOURCE_COMMIT}
          if ($env:TRACE_FROM_CREATION -eq 'true') {
            $arguments.Tag='md3-v190'
            $arguments.ExpectedCommit='35d1074faea221fa4f289f1db1e0ee428a90d701'
            $arguments.FromCreation=$true
          }
          ./scripts/ci/Trace-HostedReleaseStartup.ps1 @arguments

      - name: Upload safe and encrypted diagnostic evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hosted-startup-trace-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            diagnostic/startup/trace-summary.json
            diagnostic/startup/encrypted/receipt.json
            diagnostic/startup/encrypted/envelope.json
            diagnostic/startup/encrypted/images.zip.aesgcm
          if-no-files-found: warn
          retention-days: 7
