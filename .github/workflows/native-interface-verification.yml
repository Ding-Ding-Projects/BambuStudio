name: Focused native interface verification

on:
  push:
    branches: [main]
    paths: [.github/workflows/native-interface-verification.yml]
  workflow_dispatch:
    inputs:
      cancellation_only:
        description: Run only the source-isolated cancellation observation contract
        type: boolean
        default: false

      minimum_observation_only:
        description: Run only the source-isolated minimum observation contract
        type: boolean
        default: false

      motion_runtime_only:
        description: Run the production animator with a real wx event loop
        type: boolean
        default: false

permissions:
  contents: read

# Explicitly requested hosted-only verification for this interface change.
# Registration pushes do not run an incomplete cross-branch candidate.
jobs:
  invalid-selection:
    if: github.event_name == 'workflow_dispatch' && ((inputs.cancellation_only && inputs.minimum_observation_only) || (inputs.motion_runtime_only && (inputs.cancellation_only || inputs.minimum_observation_only)))
    runs-on: windows-2025
    timeout-minutes: 1
    steps:
      - shell: pwsh
        run: throw 'Choose only one focused contract.'
  cancellation-contract:
    if: github.event_name == 'workflow_dispatch' && inputs.cancellation_only && !inputs.minimum_observation_only && !inputs.motion_runtime_only
    runs-on: windows-2025
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify cancellation observation contract
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_OS -ne 'Windows') {
            throw 'Cancellation contract requires a disposable hosted Windows runner.'
          }
          $source = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $source -cne $env:GITHUB_SHA) { throw 'Checkout identity does not match this run.' }
          New-Item -ItemType Directory -Force artifacts/cancellation-contract | Out-Null
          $receipt = [ordered]@{
            schema = 1; sourceCommit = $source; runId = $env:GITHUB_RUN_ID; runAttempt = $env:GITHUB_RUN_ATTEMPT
            execution = 'github-hosted-windows'; status = 'running'; exitCode = $null; expectedCases = 18
            driverSha256 = (Get-FileHash scripts/md3/drive-native-interface.py -Algorithm SHA256).Hash.ToLowerInvariant()
            contractSha256 = (Get-FileHash scripts/md3/test_native_cancel_observation.py -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $receipt | ConvertTo-Json | Set-Content artifacts/cancellation-contract/receipt.json -Encoding utf8
          $testExit = $null
          try {
            python scripts/md3/test_native_cancel_observation.py -v 2>&1 |
              Tee-Object -FilePath artifacts/cancellation-contract/output.txt
            $testExit = $LASTEXITCODE
          } finally {
            $receipt.exitCode = $testExit
            $receipt.status = if ($null -ne $testExit -and $testExit -eq 0) { 'passed' } else { 'failed' }
            $receipt | ConvertTo-Json | Set-Content artifacts/cancellation-contract/receipt.json -Encoding utf8
          }
          if ($null -eq $testExit -or $testExit -ne 0) { throw 'Cancellation observation contract failed.' }
      - name: Retain cancellation contract records
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cancellation-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/cancellation-contract/receipt.json
            artifacts/cancellation-contract/output.txt
          if-no-files-found: warn
          retention-days: 14
  minimum-observation-contract:
    if: github.event_name == 'workflow_dispatch' && inputs.minimum_observation_only && !inputs.cancellation_only && !inputs.motion_runtime_only
    runs-on: windows-2025
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify minimum observation contract
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_OS -ne 'Windows') {
            throw 'Minimum observation contract requires a disposable hosted Windows runner.'
          }
          $source = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $source -cne $env:GITHUB_SHA) { throw 'Checkout identity does not match this run.' }
          New-Item -ItemType Directory -Force artifacts/minimum-observation-contract | Out-Null
          $receipt = [ordered]@{
            schema = 1; sourceCommit = $source; runId = $env:GITHUB_RUN_ID; runAttempt = $env:GITHUB_RUN_ATTEMPT
            execution = 'github-hosted-windows'; status = 'running'; exitCode = $null; expectedCases = 9
            driverSha256 = (Get-FileHash scripts/md3/drive-native-interface.py -Algorithm SHA256).Hash.ToLowerInvariant()
            contractSha256 = (Get-FileHash scripts/md3/test_native_minimum_observation.py -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $receipt | ConvertTo-Json | Set-Content artifacts/minimum-observation-contract/receipt.json -Encoding utf8
          $testExit = $null
          try {
            python scripts/md3/test_native_minimum_observation.py 2>&1 |
              Tee-Object -FilePath artifacts/minimum-observation-contract/output.txt
            $testExit = $LASTEXITCODE
          } finally {
            $receipt.exitCode = $testExit
            $receipt.status = if ($null -ne $testExit -and $testExit -eq 0) { 'passed' } else { 'failed' }
            $receipt | ConvertTo-Json | Set-Content artifacts/minimum-observation-contract/receipt.json -Encoding utf8
          }
          if ($null -eq $testExit -or $testExit -ne 0) { throw 'Minimum observation contract failed.' }
      - name: Retain minimum observation contract records
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: minimum-observation-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/minimum-observation-contract/receipt.json
            artifacts/minimum-observation-contract/output.txt
          if-no-files-found: warn
          retention-days: 14
  motion-runtime:
    if: github.event_name == 'workflow_dispatch' && inputs.motion_runtime_only && !inputs.cancellation_only && !inputs.minimum_observation_only
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Restore existing native dependency prefix
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ github.workspace }}/deps/build/BambuStudio_dep
          key: windows-latest-cache-bambustudio_deps-build-${{ hashFiles('deps/**') }}
          fail-on-cache-miss: true
      - name: Configure and compile only the motion fixtures
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_OS -ne 'Windows') { throw 'Motion verification requires a disposable hosted Windows runner.' }
          $source = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $source -cne $env:GITHUB_SHA) { throw 'Checkout identity mismatch.' }
          $prefix = Join-Path $env:GITHUB_WORKSPACE 'deps/build/BambuStudio_dep/usr/local'
          if (-not (Test-Path -LiteralPath $prefix -PathType Container)) { throw 'Native dependency prefix is unavailable.' }
          if (-not (Get-Command pkg-config.exe -ErrorAction SilentlyContinue)) {
            choco install pkgconfiglite --version=0.28.0 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'pkg-config provisioning failed.' }
          }
          New-Item -ItemType Directory -Force artifacts/motion-runtime | Out-Null
          $python = (Get-Command python.exe -CommandType Application -All -ErrorAction Stop | Select-Object -First 1).Path
          cmake -S . -B motion-build -G Ninja -DSLIC3R_BUILD_TESTS=ON -DSLIC3R_MSVC_PDB=OFF -DBBL_RELEASE_TO_PUBLIC=1 -DBBL_INTERNAL_TESTING=0 "-DCMAKE_PREFIX_PATH=$prefix" "-DPython3_EXECUTABLE=$python" -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'Motion configuration failed.' }
          cmake --build motion-build --config Release --parallel 4 --target motion_runtime_test motion_runtime_stop_mutation
          if ($LASTEXITCODE -ne 0) { throw 'Motion compilation failed.' }
      - name: Observe real wx timer lifetime and reject a broken cancellation
        timeout-minutes: 3
        run: |
          $prefix = Join-Path $env:GITHUB_WORKSPACE 'deps/build/BambuStudio_dep/usr/local'
          $dllPaths = @(Get-ChildItem -LiteralPath $prefix -Filter '*.dll' -File -Recurse | ForEach-Object DirectoryName | Sort-Object -Unique)
          $env:PATH = ($dllPaths -join ';') + ';' + $env:PATH
          Add-Type -Path scripts/ci/HostedScaleProcess.cs
          $out = (Resolve-Path -LiteralPath artifacts/motion-runtime).ProviderPath
          $receipt = [ordered]@{
            schema=1; sourceCommit=$env:GITHUB_SHA; runId=$env:GITHUB_RUN_ID; runAttempt=$env:GITHUB_RUN_ATTEMPT
            execution='github-hosted-windows'; status='failed'; expectedCases=14; files=@{}; processes=@{}
            preferenceAcquisition='injected'; pixelEvidence=$false; negativeRejected=$false
          }
          foreach ($path in @('src/slic3r/GUI/Widgets/MD3Motion.cpp','src/slic3r/GUI/Widgets/MD3MotionPreference.cpp','src/slic3r/GUI/Widgets/MD3Motion.hpp','src/slic3r/GUI/Widgets/MD3MotionPolicy.hpp','tests/native_gui/motion_runtime.cpp','tests/native_gui/CMakeLists.txt','scripts/ci/HostedScaleProcess.cs','.github/workflows/native-interface-verification.yml')) {
            $receipt.files[$path] = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          try {
            foreach ($entry in @(@{target='motion_runtime_stop_mutation'; label='negative'},@{target='motion_runtime_test'; label='production'})) {
              $exes = @(Get-ChildItem motion-build -Filter "$($entry.target).exe" -File -Recurse)
              if ($exes.Count -ne 1) { throw 'Expected exactly one fixture executable.' }
              $json = Join-Path $out "$($entry.label).json"
              $csv = Join-Path $out "$($entry.label).csv"
              $result = [HostedScaleProcess]::Run($exes[0].FullName,[string[]]@($json,$csv),45,$false)
              $receipt.processes[$entry.label] = @{
                terminated=$result.Terminated; exitCode=$result.Code; stage=[int]$result.ProcessStage
                executableSha256=(Get-FileHash -LiteralPath $exes[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              }
              if (-not $result.Terminated) { throw 'Fixture process ownership is uncertain.' }
              if (-not (Test-Path -LiteralPath $json -PathType Leaf) -or (Get-Item -LiteralPath $json).Length -gt 4096) { throw 'Fixture receipt is missing or oversized.' }
              $observed = Get-Content -LiteralPath $json -Raw | ConvertFrom-Json
              if ($observed.schema -ne 1 -or $observed.desktopRestored -cne $true -or $observed.desktopClosed -cne $true) { throw 'Fixture desktop teardown was not verified.' }
              if ($entry.label -eq 'negative') {
                if ($result.Code -ne 1 -or $observed.passed -cne $false -or $observed.cases -ne 1 -or $observed.phase -cne 'explicit_stop') { throw 'The cancellation mutation did not fail at the intended assertion.' }
                $receipt.negativeRejected = $true
              } else {
                if ($result.Code -ne 0 -or $observed.passed -cne $true -or $observed.cases -ne 14 -or $observed.phase -cne 'teardown') { throw 'Production motion lifetime checks failed.' }
              }
              if (-not (Test-Path -LiteralPath $csv -PathType Leaf) -or (Get-Item -LiteralPath $csv).Length -gt 131072) { throw 'Temporal record is missing or oversized.' }
              $receipt.files["$($entry.label).json"] = (Get-FileHash -LiteralPath $json -Algorithm SHA256).Hash.ToLowerInvariant()
              $receipt.files["$($entry.label).csv"] = (Get-FileHash -LiteralPath $csv -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            $receipt.status = 'passed'
          } finally {
            $receipt | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $out 'receipt.json') -Encoding utf8
          }
      - name: Retain fixed motion observations
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: motion-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/motion-runtime/receipt.json
            artifacts/motion-runtime/negative.json
            artifacts/motion-runtime/negative.csv
            artifacts/motion-runtime/production.json
            artifacts/motion-runtime/production.csv
          if-no-files-found: warn
          retention-days: 14
  focused:
    if: github.event_name == 'workflow_dispatch' && !inputs.cancellation_only && !inputs.minimum_observation_only && !inputs.motion_runtime_only
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Initialize x64 compiler
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Record candidate and toolchain
        run: |
          New-Item -ItemType Directory -Force artifacts/native-interface | Out-Null
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) { throw 'MSVC is unavailable.' }
          if (-not (Get-Command node.exe -ErrorAction SilentlyContinue)) { throw 'Node.js is unavailable.' }
          [ordered]@{sourceCommit=$env:GITHUB_SHA;runId=$env:GITHUB_RUN_ID;execution='github-hosted-windows'} |
            ConvertTo-Json | Set-Content artifacts/native-interface/run.json -Encoding utf8
      - name: Compile and exercise canvas search state
        run: |
          cl /nologo /std:c++17 /EHsc /I src tests/canvas_menu/search_state_tests.cpp /Fe:artifacts/native-interface/canvas-menu.exe
          if ($LASTEXITCODE -ne 0) { throw 'Canvas search model compilation failed.' }
          & artifacts/native-interface/canvas-menu.exe
          if ($LASTEXITCODE -ne 0) { throw 'Canvas search model checks failed.' }
      - name: Compile and exercise shared motion policy
        if: ${{ !cancelled() }}
        run: |
          cl /nologo /std:c++17 /EHsc /I src tests/native_gui/motion_policy.cpp /Fe:artifacts/native-interface/motion-policy.exe
          if ($LASTEXITCODE -ne 0) { throw 'Motion policy compilation failed.' }
          & artifacts/native-interface/motion-policy.exe | Tee-Object artifacts/native-interface/motion-policy.txt
          if ($LASTEXITCODE -ne 0) { throw 'Motion policy checks failed.' }
      - name: Compile and exercise preview geometry and deferred timing
        if: ${{ !cancelled() }}
        run: |
          cl /nologo /std:c++17 /EHsc /I src tests/preview_layout/geometry_tests.cpp /Fe:artifacts/native-interface/preview-layout.exe
          if ($LASTEXITCODE -ne 0) { throw 'Preview geometry compilation failed.' }
          & artifacts/native-interface/preview-layout.exe
          if ($LASTEXITCODE -ne 0) { throw 'Preview geometry checks failed.' }
      - name: Compile and exercise print continuation state
        if: ${{ !cancelled() }}
        run: |
          cl /nologo /std:c++17 /EHsc /I src /I tests tests/print_workflow/print_workflow_tests.cpp /Fe:artifacts/native-interface/print-workflow.exe
          if ($LASTEXITCODE -ne 0) { throw 'Print continuation compilation failed.' }
          & artifacts/native-interface/print-workflow.exe --reporter junit --out artifacts/native-interface/print-workflow.xml
          if ($LASTEXITCODE -ne 0) { throw 'Print continuation checks failed.' }
      - name: Verify native conversion and menu contracts
        if: ${{ !cancelled() }}
        run: |
          node --test --test-reporter=tap ui-md3/tests/md3-conversion-contracts.test.mjs ui-md3/tests/context-menus.test.mjs ui-md3/tests/check-context-menus.test.mjs ui-md3/tests/config-profiles-list.test.mjs ui-md3/tests/search-field-end-cap.test.mjs ui-md3/tests/preview-overlays.test.mjs 2>&1 |
            Tee-Object -FilePath artifacts/native-interface/source-contracts.tap
          if ($LASTEXITCODE -ne 0) { throw 'Native source contracts failed.' }
      - name: Verify slice lifecycle source mutations
        if: ${{ !cancelled() }}
        run: |
          node tests/print_workflow/slice_lifecycle_source_tests.mjs 2>&1 |
            Tee-Object -FilePath artifacts/native-interface/slice-lifecycle.tap
          if ($LASTEXITCODE -ne 0) { throw 'Slice lifecycle source checks failed.' }
      - name: Verify fresh cancellation observation selection
        if: ${{ !cancelled() }}
        run: |
          python scripts/md3/test_native_cancel_observation.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Cancellation observation checks failed.' }
          python scripts/md3/test_automation_fixture_paths.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Automation fixture path checks failed.' }
      - name: Retain safe verification records
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-interface-${{ github.sha }}
          path: |
            artifacts/native-interface/*.json
            artifacts/native-interface/*.xml
            artifacts/native-interface/*.tap
          if-no-files-found: warn
          retention-days: 14
  native-services:
    if: github.event_name == 'workflow_dispatch' && !inputs.cancellation_only && !inputs.minimum_observation_only && !inputs.motion_runtime_only
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Prepare native configuration tools
        run: |
          foreach ($tool in @('cmake.exe','ninja.exe')) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) { throw "Hosted native tool is missing: $tool" }
          }
          if (-not (Get-Command pkg-config.exe -ErrorAction SilentlyContinue)) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              choco install pkgconfiglite --version=0.28.0 --yes --no-progress
              if ($LASTEXITCODE -eq 0) { break }
              if ($attempt -eq 3) { throw 'pkgconfiglite 0.28.0 provisioning failed.' }
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          if (-not (Get-Command pkg-config.exe -ErrorAction SilentlyContinue)) { throw 'pkg-config is unavailable after provisioning.' }
      - name: Restore dependency prefix from the native build
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ github.workspace }}/deps/build/BambuStudio_dep
          key: windows-latest-cache-bambustudio_deps-build-${{ hashFiles('deps/**') }}
          fail-on-cache-miss: true
      - name: Configure focused native services
        run: |
          $prefix = Join-Path $env:GITHUB_WORKSPACE 'deps/build/BambuStudio_dep/usr/local'
          if (-not (Test-Path -LiteralPath $prefix -PathType Container)) {
            throw 'The native dependency build must finish for this source before focused service verification.'
          }
          New-Item -ItemType Directory -Force artifacts/native-services | Out-Null
          [ordered]@{sourceCommit=$env:GITHUB_SHA;runId=$env:GITHUB_RUN_ID;execution='github-hosted-windows'} |
            ConvertTo-Json | Set-Content artifacts/native-services/run.json -Encoding utf8
          $python = (Get-Command python.exe -ErrorAction Stop).Source
          cmake -S . -B focused-build -G Ninja -DSLIC3R_BUILD_TESTS=ON -DSLIC3R_MSVC_PDB=OFF -DBBL_RELEASE_TO_PUBLIC=1 -DBBL_INTERNAL_TESTING=0 "-DCMAKE_PREFIX_PATH=$prefix" "-DPython3_EXECUTABLE=$python" -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'Focused native service configuration failed.' }
          cmake --build focused-build --config Release --parallel 4 --target personal_vocabulary_tests personal_vocabulary_probe language_mode_tests profile_archive_tests bounded_regex_tests
          if ($LASTEXITCODE -ne 0) { throw 'Focused native service compilation failed.' }
      - name: Verify canvas regex whole-word parity with the real worker
        timeout-minutes: 2
        run: |
          $prefix = Join-Path $env:GITHUB_WORKSPACE 'deps/build/BambuStudio_dep/usr/local'
          $dllPaths = @(Get-ChildItem -LiteralPath $prefix -Filter '*.dll' -File -Recurse | ForEach-Object DirectoryName | Sort-Object -Unique)
          $env:PATH = ($dllPaths -join ';') + ';' + $env:PATH
          $executables = @(Get-ChildItem focused-build -Filter 'bounded_regex_tests.exe' -File -Recurse)
          if ($executables.Count -ne 1) { throw 'Expected one bounded regex executable.' }
          & $executables[0].FullName '[canvas_menu_parity]' --reporter junit --out artifacts/native-services/canvas-menu-parity.xml
          if ($LASTEXITCODE -ne 0) { throw 'Canvas regex whole-word parity failed.' }
      - name: Exercise native parser display persistence and archive behavior
        run: |
          $prefix = Join-Path $env:GITHUB_WORKSPACE 'deps/build/BambuStudio_dep/usr/local'
          $dllPaths = @(Get-ChildItem -LiteralPath $prefix -Filter '*.dll' -File -Recurse | ForEach-Object DirectoryName | Sort-Object -Unique)
          $env:PATH = ($dllPaths -join ';') + ';' + $env:PATH
          foreach ($target in @('personal_vocabulary_tests','language_mode_tests','profile_archive_tests')) {
            $executables = @(Get-ChildItem focused-build -Filter "$target.exe" -File -Recurse)
            if ($executables.Count -ne 1) { throw "Expected one executable for $target." }
            & $executables[0].FullName --reporter junit --out "artifacts/native-services/$target.xml"
            if ($LASTEXITCODE -ne 0) { throw "Native service verification failed: $target." }
          }
          $probes = @(Get-ChildItem focused-build -Filter 'personal_vocabulary_probe.exe' -File -Recurse)
          if ($probes.Count -ne 1) { throw 'Expected one vocabulary persistence probe.' }
          foreach ($phase in @('load-first','restore-first','invalid','replace','restore-second','clear','restore-empty')) {
            & $probes[0].FullName $phase
            if ($LASTEXITCODE -ne 0) { throw "Synthetic persistence phase failed: $phase." }
          }
          $writers = @()
          try {
            $writers += Start-Process -FilePath $probes[0].FullName -ArgumentList 'race-a' -WindowStyle Hidden -PassThru
            $writers += Start-Process -FilePath $probes[0].FullName -ArgumentList 'race-b' -WindowStyle Hidden -PassThru
            foreach ($writer in $writers) {
              if (-not $writer.WaitForExit(30000)) { throw 'Synthetic concurrent writer timed out.' }
              if ($writer.ExitCode -ne 0) { throw 'Synthetic concurrent writer failed.' }
            }
          } finally {
            foreach ($writer in $writers) {
              if (-not $writer.HasExited) { $writer.Kill(); [void]$writer.WaitForExit(5000) }
              $writer.Dispose()
            }
          }
          foreach ($phase in @('verify-race','clear','restore-empty')) {
            & $probes[0].FullName $phase
            if ($LASTEXITCODE -ne 0) { throw "Concurrent persistence verification failed: $phase." }
          }
          ctest --test-dir focused-build -R '^personal_vocabulary_native_contract$' --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Native display boundary contract failed.' }
      - name: Retain native service results
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-services-${{ github.sha }}
          path: artifacts/native-services/
          if-no-files-found: warn
          retention-days: 14
