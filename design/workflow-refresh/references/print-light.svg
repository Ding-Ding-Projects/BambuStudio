<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Print: light static design reference</title><desc id="desc">Source-native Studio Atlas layout specification. Not a screenshot or a working application. Current generation and plate checks, existing setup and final print confirmation, real AMS checks and cancellation. Navigation never submits.</desc><g font-family="Roboto, Arial, sans-serif"><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f7f9fc" stroke="none"/><rect x="0" y="0" width="1200" height="46" rx="0" fill="#ffffff" stroke="none"/><rect x="18" y="12" width="22" height="22" rx="7" fill="#0f766e" stroke="none"/><text x="49" y="29" font-size="15" fill="#172434" font-weight="650">Bambu Studio</text><text x="206" y="28" font-size="12" fill="#46576a" font-weight="400">Studio Atlas / source reference</text><text x="1008" y="28" font-size="11.5" fill="#46576a" font-weight="400">Version unavailable</text><text x="1160" y="28" font-size="20" fill="#46576a" font-weight="400">×</text><path d="M0 46L1200 46" fill="none" stroke="#c4d0df"/><rect x="12" y="53" width="498" height="40" rx="16" fill="#eef2f7" stroke="#c4d0df"/><text x="34" y="78" font-size="14" fill="#46576a" font-weight="400">Prepare</text><text x="156" y="78" font-size="14" fill="#46576a" font-weight="400">Preview</text><rect x="262" y="56" width="116" height="34" rx="17" fill="#9cf2e7" stroke="none"/><text x="278" y="78" font-size="14" fill="#00201d" font-weight="650">Print</text><rect x="310" y="86" width="20" height="3" rx="1.5" fill="#0f766e" stroke="none"/><text x="400" y="78" font-size="14" fill="#46576a" font-weight="400">Monitor</text><text x="540" y="79" font-size="13" fill="#46576a" font-weight="400">Home</text><text x="606" y="79" font-size="13" fill="#46576a" font-weight="400">Project</text><text x="684" y="79" font-size="13" fill="#46576a" font-weight="400">Multi-device</text><text x="796" y="79" font-size="13" fill="#46576a" font-weight="400">Filament</text><text x="887" y="79" font-size="13" fill="#46576a" font-weight="400">Calibration</text><text x="996" y="79" font-size="13" fill="#46576a" font-weight="400">Preferences</text><text x="1114" y="79" font-size="13" fill="#46576a" font-weight="400">More</text><text x="24" y="134" font-size="24" fill="#172434" font-weight="700">Print</text><text x="24" y="157" font-size="12.5" fill="#46576a" font-weight="400">Static design reference. Illustrative controls are not interactive.</text><rect x="982" y="114" width="194" height="36" rx="18" fill="#eef2f7" stroke="none"/><text x="996" y="137" font-size="13" fill="#46576a" font-weight="400">Light / comfortable</text><rect x="24" y="180" width="724" height="146" rx="16" fill="#ffffff" stroke="#c4d0df"/><text x="44" y="211" font-size="16" fill="#172434" font-weight="650">1  Plate readiness</text><rect x="44" y="230" width="104" height="36" rx="18" fill="#9cf2e7" stroke="none"/><text x="58" y="253" font-size="13" fill="#00201d" font-weight="600">Review</text><text x="164" y="251" font-size="15" fill="#172434" font-weight="600">Current plate and slice generation</text><text x="44" y="297" font-size="14" fill="#46576a" font-weight="400">A stale or missing slice keeps print setup unavailable.</text><rect x="24" y="342" width="724" height="202" rx="16" fill="#ffffff" stroke="#c4d0df"/><text x="44" y="373" font-size="16" fill="#172434" font-weight="650">2  Destination and mapping</text><text x="44" y="408" font-size="12.5" fill="#46576a" font-weight="400">Printer</text><rect x="44" y="418" width="320" height="40" rx="10" fill="#f7f9fc" stroke="#6d7e94"/><text x="56" y="443" font-size="14" fill="#172434" font-weight="400">Existing printer selection</text><text x="388" y="408" font-size="12.5" fill="#46576a" font-weight="400">Material mapping</text><rect x="388" y="418" width="340" height="40" rx="10" fill="#f7f9fc" stroke="#6d7e94"/><text x="400" y="443" font-size="14" fill="#172434" font-weight="400">Existing AMS / spool mapping</text><text x="44" y="515" font-size="14" fill="#46576a" font-weight="400">Compatibility and availability remain authoritative.</text><rect x="24" y="560" width="724" height="130" rx="16" fill="#ffffff" stroke="#c4d0df"/><text x="44" y="591" font-size="16" fill="#172434" font-weight="650">3  Continue deliberately</text><text x="44" y="615" font-size="14" fill="#46576a" font-weight="400">The existing setup dialog keeps final print confirmation.</text><text x="44" y="650" font-size="14" fill="#46576a" font-weight="400">Opening this workspace never submits a job.</text><rect x="764" y="180" width="412" height="510" rx="16" fill="#ffffff" stroke="#c4d0df"/><text x="784" y="211" font-size="16" fill="#172434" font-weight="650">Print summary</text><text x="784" y="254" font-size="13" fill="#46576a" font-weight="400">Plate</text><text x="784" y="279" font-size="14" fill="#172434" font-weight="400">Available from current project</text><text x="784" y="317" font-size="13" fill="#46576a" font-weight="400">Printer</text><text x="784" y="342" font-size="14" fill="#172434" font-weight="400">Available from current project</text><text x="784" y="380" font-size="13" fill="#46576a" font-weight="400">Material</text><text x="784" y="405" font-size="14" fill="#172434" font-weight="400">Available from current project</text><text x="784" y="443" font-size="13" fill="#46576a" font-weight="400">Estimated duration</text><text x="784" y="468" font-size="14" fill="#172434" font-weight="400">Available from current project</text><rect x="784" y="622" width="372" height="40" rx="20" fill="#0f766e" stroke="none"/><text x="802" y="647" font-size="14" fill="#ffffff" font-weight="600">Review print setup</text><path d="M24 710L1176 710" fill="none" stroke="#c4d0df"/><text x="24" y="735" font-size="12" fill="#46576a" font-weight="400">Reference: print/light  |  1200 × 800 DIP  |  No runtime verification</text><text x="24" y="759" font-size="12" fill="#46576a" font-weight="400">State inventory: 17 explicit states in manifest.json; each still needs real interaction and capture proof.</text><text x="24" y="782" font-size="11.5" fill="#46576a" font-weight="400">Material roles • Opaque surfaces • Local search and pattern builder • Visible focus • Reduced motion</text></g></svg>
