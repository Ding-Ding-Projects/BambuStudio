<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Project: light static design reference</title><desc id="desc">Source-native Studio Atlas layout specification. Not a screenshot or a working application. Online project destination and local workspace identities, save/load, stable members, reminders and non-printing calendar.</desc><g font-family="Roboto, Arial, sans-serif"><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f7f9fc" stroke="none"/><rect x="0" y="0" width="1200" height="46" rx="0" fill="#ffffff" stroke="none"/><rect x="18" y="12" width="22" height="22" rx="7" fill="#146c2e" stroke="none"/><text x="49" y="29" font-size="15" fill="#172434" font-weight="650">Bambu Studio</text><text x="206" y="28" font-size="12" fill="#46576a" font-weight="400">Studio Atlas / source reference</text><text x="1008" y="28" font-size="11.5" fill="#46576a" font-weight="400">Version unavailable</text><text x="1160" y="28" font-size="20" fill="#46576a" font-weight="400">×</text><path d="M0 46L1200 46" fill="none" stroke="#c4d0df"/><rect x="12" y="53" width="498" height="40" rx="16" fill="#eef2f7" stroke="#c4d0df"/><text x="34" y="78" font-size="14" fill="#46576a" font-weight="400">Prepare</text><text x="156" y="78" font-size="14" fill="#46576a" font-weight="400">Preview</text><text x="278" y="78" font-size="14" fill="#46576a" font-weight="400">Print</text><text x="400" y="78" font-size="14" fill="#46576a" font-weight="400">Monitor</text><text x="540" y="79" font-size="13" fill="#46576a" font-weight="400">Home</text><text x="606" y="79" font-size="13" fill="#46576a" font-weight="400">Project</text><text x="684" y="79" font-size="13" fill="#46576a" font-weight="400">Multi-device</text><text x="796" y="79" font-size="13" fill="#46576a" font-weight="400">Filament</text><text x="887" y="79" font-size="13" fill="#46576a" font-weight="400">Calibration</text><text x="996" y="79" font-size="13" fill="#46576a" font-weight="400">Preferences</text><text x="1114" y="79" font-size="13" fill="#46576a" font-weight="400">More</text><text x="24" y="134" font-size="24" fill="#172434" font-weight="700">Project</text><text x="24" y="157" font-size="12.5" fill="#46576a" font-weight="400">Static design reference. Illustrative controls are not interactive.</text><rect x="982" y="114" width="194" height="36" rx="18" fill="#eef2f7" stroke="none"/><text x="996" y="137" font-size="13" fill="#46576a" font-weight="400">Light / comfortable</text><rect x="24" y="180" width="288" height="510" rx="16" fill="#ffffff" stroke="#c4d0df"/><text x="44" y="211" font-size="16" fill="#172434" font-weight="650">Browse</text><rect x="40" y="232" width="256" height="36" rx="18" fill="#a6f4b8" stroke="none"/><text x="54" y="255" font-size="13" fill="#00210c" font-weight="600">Workspace files</text><rect x="40" y="304" width="256" height="36" rx="18" fill="#eef2f7" stroke="none"/><text x="54" y="327" font-size="13" fill="#46576a" font-weight="400">Checklist and notes</text><rect x="40" y="376" width="256" height="36" rx="18" fill="#eef2f7" stroke="none"/><text x="54" y="399" font-size="13" fill="#46576a" font-weight="400">Print calendar</text><rect x="40" y="448" width="256" height="36" rx="18" fill="#eef2f7" stroke="none"/><text x="54" y="471" font-size="13" fill="#46576a" font-weight="400">Project history</text><rect x="40" y="520" width="256" height="36" rx="18" fill="#eef2f7" stroke="none"/><text x="54" y="543" font-size="13" fill="#46576a" font-weight="400">Project details</text><rect x="328" y="180" width="848" height="510" rx="16" fill="#ffffff" stroke="#c4d0df"/><text x="348" y="211" font-size="16" fill="#172434" font-weight="650">Workspace files</text><text x="352" y="255" font-size="12.5" fill="#46576a" font-weight="400">Local search</text><rect x="352" y="265" width="800" height="40" rx="10" fill="#f7f9fc" stroke="#718298"/><text x="364" y="290" font-size="14" fill="#172434" font-weight="400">Plain text search with adjacent pattern builder</text><rect x="352" y="333" width="800" height="60" rx="12" fill="#f7f9fc" stroke="#c4d0df"/><text x="368" y="357" font-size="15" fill="#172434" font-weight="600">Checklist and notes</text><text x="368" y="380" font-size="12" fill="#46576a" font-weight="400">Real values, actions, state and explanation</text><rect x="352" y="407" width="800" height="60" rx="12" fill="#f7f9fc" stroke="#c4d0df"/><text x="368" y="431" font-size="15" fill="#172434" font-weight="600">Print calendar</text><text x="368" y="454" font-size="12" fill="#46576a" font-weight="400">Real values, actions, state and explanation</text><rect x="352" y="481" width="800" height="60" rx="12" fill="#f7f9fc" stroke="#c4d0df"/><text x="368" y="505" font-size="15" fill="#172434" font-weight="600">Project history</text><text x="368" y="528" font-size="12" fill="#46576a" font-weight="400">Real values, actions, state and explanation</text><rect x="352" y="555" width="800" height="60" rx="12" fill="#f7f9fc" stroke="#c4d0df"/><text x="368" y="579" font-size="15" fill="#172434" font-weight="600">Project details</text><text x="368" y="602" font-size="12" fill="#46576a" font-weight="400">Real values, actions, state and explanation</text><text x="352" y="665" font-size="12" fill="#46576a" font-weight="400">Lists, fields and actions retain their existing behavior.</text><path d="M24 710L1176 710" fill="none" stroke="#c4d0df"/><text x="24" y="735" font-size="12" fill="#46576a" font-weight="400">Reference: project/light  |  1200 × 800 DIP  |  No runtime verification</text><text x="24" y="759" font-size="12" fill="#46576a" font-weight="400">State inventory: 14 explicit states in manifest.json; each still needs real interaction and capture proof.</text><text x="24" y="782" font-size="11.5" fill="#46576a" font-weight="400">Material roles • Opaque surfaces • Local search and pattern builder • Visible focus • Reduced motion</text></g></svg>
