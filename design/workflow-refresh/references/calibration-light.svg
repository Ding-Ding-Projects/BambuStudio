<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Calibration: light static design reference</title><desc id="desc">Source-native Studio Atlas layout specification. Not a screenshot or a working application. Every existing calibration algorithm, range, printer selection, actual action and result-save route.</desc><g font-family="Roboto, Arial, sans-serif"><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f7f9fc" stroke="none"/><rect x="0" y="0" width="1200" height="46" rx="0" fill="#ffffff" stroke="none"/><rect x="18" y="12" width="22" height="22" rx="7" fill="#146c2e" stroke="none"/><text x="49" y="29" font-size="15" fill="#172434" font-weight="650">Bambu Studio</text><text x="206" y="28" font-size="12" fill="#46576a" font-weight="400">Studio Atlas / source reference</text><text x="1008" y="28" font-size="11.5" fill="#46576a" font-weight="400">Version unavailable</text><text x="1160" y="28" font-size="20" fill="#46576a" font-weight="400">×</text><path d="M0 46L1200 46" fill="none" stroke="#c4d0df"/><rect x="12" y="53" width="498" height="40" rx="16" fill="#eef2f7" stroke="#c4d0df"/><text x="34" y="78" font-size="14" fill="#46576a" font-weight="400">Prepare</text><text x="156" y="78" font-size="14" fill="#46576a" font-weight="400">Preview</text><text x="278" y="78" font-size="14" fill="#46576a" font-weight="400">Print</text><text x="400" y="78" font-size="14" fill="#46576a" font-weight="400">Monitor</text><text x="540" y="79" font-size="13" fill="#46576a" font-weight="400">Home</text><text x="606" y="79" font-size="13" fill="#46576a" font-weight="400">Project</text><text x="684" y="79" font-size="13" fill="#46576a" font-weight="400">Multi-device</text><text x="796" y="79" font-size="13" fill="#46576a" font-weight="400">Filament</text><text x="887" y="79" font-size="13" fill="#46576a" font-weight="400">Calibration</text><text x="996" y="79" font-size="13" fill="#46576a" font-weight="400">Preferences</text><text x="1114" y="79" font-size="13" fill="#46576a" font-weight="400">More</text><text x="24" y="134" font-size="24" fill="#172434" font-weight="700">Calibration</text><text x="24" y="157" font-size="12.5" fill="#46576a" font-weight="400">Static design reference. Illustrative controls are not interactive.</text><rect x="982" y="114" width="194" height="36" rx="18" fill="#eef2f7" stroke="none"/><text x="996" y="137" font-size="13" fill="#46576a" font-weight="400">Light / comfortable</text><rect x="24" y="180" width="292" height="510" rx="16" fill="#ffffff" stroke="#c4d0df"/><text x="44" y="211" font-size="16" fill="#172434" font-weight="650">Steps</text><rect x="40" y="232" width="260" height="36" rx="18" fill="#a6f4b8" stroke="none"/><text x="54" y="255" font-size="13" fill="#00210c" font-weight="600">1  Choose calibration</text><rect x="40" y="308" width="260" height="36" rx="18" fill="#eef2f7" stroke="none"/><text x="54" y="331" font-size="13" fill="#46576a" font-weight="400">2  Review inputs</text><rect x="40" y="384" width="260" height="36" rx="18" fill="#eef2f7" stroke="none"/><text x="54" y="407" font-size="13" fill="#46576a" font-weight="400">3  Run calibration</text><rect x="40" y="460" width="260" height="36" rx="18" fill="#eef2f7" stroke="none"/><text x="54" y="483" font-size="13" fill="#46576a" font-weight="400">4  Inspect results</text><rect x="40" y="536" width="260" height="36" rx="18" fill="#eef2f7" stroke="none"/><text x="54" y="559" font-size="13" fill="#46576a" font-weight="400">5  Save preset</text><rect x="332" y="180" width="844" height="510" rx="16" fill="#ffffff" stroke="#c4d0df"/><text x="352" y="211" font-size="16" fill="#172434" font-weight="650">Choose calibration</text><text x="356" y="265" font-size="16" fill="#172434" font-weight="400">Existing inputs, validation and decisions remain available.</text><text x="356" y="322" font-size="12.5" fill="#46576a" font-weight="400">Review inputs</text><rect x="356" y="332" width="792" height="40" rx="10" fill="#f7f9fc" stroke="#6d7e94"/><text x="368" y="357" font-size="14" fill="#172434" font-weight="400">Choose from the existing values</text><text x="356" y="426" font-size="12.5" fill="#46576a" font-weight="400">Supporting explanation</text><rect x="356" y="436" width="792" height="40" rx="10" fill="#f7f9fc" stroke="#6d7e94"/><text x="368" y="461" font-size="14" fill="#172434" font-weight="400">Actual defaults and validation, never a decorative field</text><rect x="356" y="622" width="116" height="36" rx="18" fill="#eef2f7" stroke="none"/><text x="370" y="645" font-size="13" fill="#46576a" font-weight="400">Cancel</text><rect x="908" y="622" width="240" height="40" rx="20" fill="#146c2e" stroke="none"/><text x="926" y="647" font-size="14" fill="#ffffff" font-weight="600">Continue</text><path d="M24 710L1176 710" fill="none" stroke="#c4d0df"/><text x="24" y="735" font-size="12" fill="#46576a" font-weight="400">Reference: calibration/light  |  1200 × 800 DIP  |  No runtime verification</text><text x="24" y="759" font-size="12" fill="#46576a" font-weight="400">State inventory: 10 explicit states in manifest.json; each still needs real interaction and capture proof.</text><text x="24" y="782" font-size="11.5" fill="#46576a" font-weight="400">Material roles • Opaque surfaces • Local search and pattern builder • Visible focus • Reduced motion</text></g></svg>
