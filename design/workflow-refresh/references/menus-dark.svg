<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Menus and dialogs: dark static design reference</title><desc id="desc">Source-native Studio Atlas layout specification. Not a screenshot or a working application. Existing item order, identifiers, shortcuts, callbacks, enable rules and dismissal focus.</desc><g font-family="Roboto, Arial, sans-serif"><rect x="0" y="0" width="1200" height="800" rx="0" fill="#151c25" stroke="none"/><rect x="0" y="0" width="1200" height="46" rx="0" fill="#101720" stroke="none"/><rect x="18" y="12" width="22" height="22" rx="7" fill="#8bd89b" stroke="none"/><text x="49" y="29" font-size="15" fill="#e8eff8" font-weight="650">Bambu Studio</text><text x="206" y="28" font-size="12" fill="#b9c8da" font-weight="400">Studio Atlas / source reference</text><text x="1008" y="28" font-size="11.5" fill="#b9c8da" font-weight="400">Version unavailable</text><text x="1160" y="28" font-size="20" fill="#b9c8da" font-weight="400">×</text><path d="M0 46L1200 46" fill="none" stroke="#43566a"/><rect x="12" y="53" width="498" height="40" rx="16" fill="#1a2430" stroke="#43566a"/><text x="34" y="78" font-size="14" fill="#b9c8da" font-weight="400">Prepare</text><text x="156" y="78" font-size="14" fill="#b9c8da" font-weight="400">Preview</text><text x="278" y="78" font-size="14" fill="#b9c8da" font-weight="400">Print</text><text x="400" y="78" font-size="14" fill="#b9c8da" font-weight="400">Monitor</text><text x="540" y="79" font-size="13" fill="#b9c8da" font-weight="400">Home</text><text x="606" y="79" font-size="13" fill="#b9c8da" font-weight="400">Project</text><text x="684" y="79" font-size="13" fill="#b9c8da" font-weight="400">Multi-device</text><text x="796" y="79" font-size="13" fill="#b9c8da" font-weight="400">Filament</text><text x="887" y="79" font-size="13" fill="#b9c8da" font-weight="400">Calibration</text><text x="996" y="79" font-size="13" fill="#b9c8da" font-weight="400">Preferences</text><text x="1114" y="79" font-size="13" fill="#b9c8da" font-weight="400">More</text><text x="24" y="134" font-size="24" fill="#e8eff8" font-weight="700">Menus and dialogs</text><text x="24" y="157" font-size="12.5" fill="#b9c8da" font-weight="400">Static design reference. Illustrative controls are not interactive.</text><rect x="982" y="114" width="194" height="36" rx="18" fill="#1a2430" stroke="none"/><text x="996" y="137" font-size="13" fill="#b9c8da" font-weight="400">Dark / comfortable</text><rect x="24" y="180" width="1152" height="510" rx="16" fill="#1a2430" stroke="#43566a"/><rect x="224" y="202" width="752" height="466" rx="16" fill="#101720" stroke="#43566a"/><text x="244" y="233" font-size="16" fill="#e8eff8" font-weight="650">Menus and dialogs</text><text x="248" y="274" font-size="12.5" fill="#b9c8da" font-weight="400">Local search</text><rect x="248" y="284" width="704" height="40" rx="10" fill="#151c25" stroke="#899caf"/><text x="260" y="309" font-size="14" fill="#e8eff8" font-weight="400">Plain text search with adjacent pattern builder</text><rect x="248" y="343" width="704" height="47" rx="10" fill="#095228" stroke="none"/><text x="265" y="372" font-size="14" fill="#a7f5b9" font-weight="400">Actions and shortcuts</text><rect x="248" y="402" width="704" height="47" rx="10" fill="#151c25" stroke="none"/><text x="265" y="431" font-size="14" fill="#e8eff8" font-weight="400">Nested choices</text><rect x="248" y="461" width="704" height="47" rx="10" fill="#151c25" stroke="none"/><text x="265" y="490" font-size="14" fill="#e8eff8" font-weight="400">Disabled explanation</text><rect x="248" y="520" width="704" height="47" rx="10" fill="#151c25" stroke="none"/><text x="265" y="549" font-size="14" fill="#e8eff8" font-weight="400">Focus return</text><text x="248" y="643" font-size="12" fill="#b9c8da" font-weight="400">Escape closes and returns focus to the originating control.</text><path d="M24 710L1176 710" fill="none" stroke="#43566a"/><text x="24" y="735" font-size="12" fill="#b9c8da" font-weight="400">Reference: menus/dark  |  1200 × 800 DIP  |  No runtime verification</text><text x="24" y="759" font-size="12" fill="#b9c8da" font-weight="400">State inventory: 12 explicit states in manifest.json; each still needs real interaction and capture proof.</text><text x="24" y="782" font-size="11.5" fill="#b9c8da" font-weight="400">Material roles • Opaque surfaces • Local search and pattern builder • Visible focus • Reduced motion</text></g></svg>
