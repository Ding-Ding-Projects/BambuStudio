ill="#b9c8da" font-weight="400">Preferences</text><text x="1114" y="79" font-size="13" fill="#b9c8da" font-weight="400">More</text><text x="24" y="134" font-size="24" fill="#e8eff8" font-weight="700">Scheduled settings</text><text x="24" y="157" font-size="12.5" fill="#b9c8da" font-weight="400">Static design reference. Illustrative controls are not interactive.</text><rect x="982" y="114" width="194" height="36" rx="18" fill="#1a2430" stroke="none"/><text x="996" y="137" font-size="13" fill="#b9c8da" font-weight="400">Dark / comfortable</text><rect x="24" y="180" width="288" height="510" rx="16" fill="#101720" stroke="#43566a"/><text x="44" y="211" font-size="16" fill="#e8eff8" font-weight="650">Browse</text><rect x="40" y="232" width="256" height="36" rx="18" fill="#095228" stroke="none"/><text x="54" y="255" font-size="13" fill="#a7f5b9" font-weight="600">Schedule rules</text><rect x="40" y="304" width="256" height="36" rx="18" fill="#1a2430" stroke="none"/><text x="54" y="327" font-size="13" fill="#b9c8da" font-weight="400">Rule timing</text><rect x="40" y="376" width="256" height="36" rx="18" fill="#1a2430" stroke="none"/><text x="54" y="399" font-size="13" fill="#b9c8da" font-weight="400">Source and values</text><rect x="40" y="448" width="256" height="36" rx="18" fill="#1a2430" stroke="none"/><text x="54" y="471" font-size="13" fill="#b9c8da" font-weight="400">Precedence</text><rect x="40" y="520" width="256" height="36" rx="18" fill="#1a2430" stroke="none"/><text x="54" y="543" font-size="13" fill="#b9c8da" font-weight="400">Base settings</text><rect x="328" y="180" width="848" height="510" rx="16" fill="#101720" stroke="#43566a"/><text x="348" y="211" font-size="16" fill="#e8eff8" font-weight="650">Schedule rules</text><text x="352" y="255" font-size="12.5" fill="#b9c8da" font-weight="400">Local search</text><rect x="352" y="265" width="800" height="40" rx="10" fill="#151c25" stroke="#899caf"/><text x="364" y="290" font-size="14" fill="#e8eff8" font-weight="400">Plain text search with adjacent pattern builder</text><rect x="352" y="333" width="800" height="60" rx="12" fill="#151c25" stroke="#43566a"/><text x="368" y="357" font-size="15" fill="#e8eff8" font-weight="600">Rule timing</text><text x="368" y="380" font-size="12" fill="#b9c8da" font-weight="400">Real values, actions, state and explanation</text><rect x="352" y="407" width="800" height="60" rx="12" fill="#151c25" stroke="#43566a"/><text x="368" y="431" font-size="15" fill="#e8eff8" font-weight="600">Source and values</text><text x="368" y="454" font-size="12" fill="#b9c8da" font-weight="400">Real values, actions, state and explanation</text><rect x="352" y="481" width="800" height="60" rx="12" fill="#151c25" stroke="#43566a"/><text x="368" y="505" font-size="15" fill="#e8eff8" font-weight="600">Precedence</text><text x="368" y="528" font-size="12" fill="#b9c8da" font-weight="400">Real values, actions, state and explanation</text><rect x="352" y="555" width="800" height="60" rx="12" fill="#151c25" stroke="#43566a"/><text x="368" y="579" font-size="15" fill="#e8eff8" font-weight="600">Base settings</text><text x="368" y="602" font-size="12" fill="#b9c8da" font-weight="400">Real values, actions, state and explanation</text><text x="352" y="665" font-size="12" fill="#b9c8da" font-weight="400">Lists, fields and actions retain their existing behavior.</text><path d="M24 710L1176 710" fill="none" stroke="#43566a"/><text x="24" y="735" font-size="12" fill="#b9c8da" font-weight="400">Reference: schedules/dark  |  1200 × 800 DIP  |  No runtime verification</text><text x="24" y="759" font-size="12" fill="#b9c8da" font-weight="400">State inventory: 11 explicit states in manifest.json; each still needs real interaction and capture proof.</text><text x="24" y="782" font-size="11.5" fill="#b9c8da" font-weight="400">Material roles • Opaque surfaces • Local search and pattern builder • Visible focus • Reduced motion</text></g></svg>
