 x="352" y="309" font-size="15" fill="#46576a" font-weight="400">Existing content, headings, links and exports stay accessible.</text><rect x="352" y="349" width="778" height="8" rx="4" fill="#eef2f7" stroke="none"/><rect x="352" y="379" width="778" height="8" rx="4" fill="#eef2f7" stroke="none"/><rect x="352" y="409" width="778" height="8" rx="4" fill="#eef2f7" stroke="none"/><rect x="352" y="439" width="778" height="8" rx="4" fill="#eef2f7" stroke="none"/><rect x="352" y="469" width="778" height="8" rx="4" fill="#eef2f7" stroke="none"/><rect x="352" y="499" width="480" height="8" rx="4" fill="#eef2f7" stroke="none"/><text x="352" y="590" font-size="13" fill="#46576a" font-weight="400">Illustrative typesetting; no article content is fabricated.</text><rect x="352" y="622" width="160" height="36" rx="18" fill="#eef2f7" stroke="none"/><text x="366" y="645" font-size="13" fill="#46576a" font-weight="400">Related features</text><rect x="524" y="622" width="148" height="36" rx="18" fill="#eef2f7" stroke="none"/><text x="538" y="645" font-size="13" fill="#46576a" font-weight="400">Copy / export</text><path d="M24 710L1176 710" fill="none" stroke="#c4d0df"/><text x="24" y="735" font-size="12" fill="#46576a" font-weight="400">Reference: documentation/light  |  1200 × 800 DIP  |  No runtime verification</text><text x="24" y="759" font-size="12" fill="#46576a" font-weight="400">State inventory: 9 explicit states in manifest.json; each still needs real interaction and capture proof.</text><text x="24" y="782" font-size="11.5" fill="#46576a" font-weight="400">Material roles • Opaque surfaces • Local search and pattern builder • Visible focus • Reduced motion</text></g></svg>
