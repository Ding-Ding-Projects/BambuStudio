<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Printer details: dark static design reference</title><desc id="desc">Source-native Studio Atlas layout specification. Not a screenshot or a working application. Existing embedded command bridge, selected printer, permissions and action confirmations.</desc><g font-family="Roboto, Arial, sans-serif"><rect x="0" y="0" width="1200" height="800" rx="0" fill="#151c25" stroke="none"/><rect x="0" y="0" width="1200" height="46" rx="0" fill="#101720" stroke="none"/><rect x="18" y="12" width="22" height="22" rx="7" fill="#5eead4" stroke="none"/><text x="49" y="29" font-size="15" fill="#e8eff8" font-weight="650">Bambu Studio</text><text x="206" y="28" font-size="12" fill="#b9c8da" font-weight="400">Studio Atlas / source reference</text><text x="1008" y="28" font-size="11.5" fill="#b9c8da" font-weight="400">Version unavailable</text><text x="1160" y="28" font-size="20" fill="#b9c8da" font-weight="400">×</text><path d="M0 46L1200 46" fill="none" stroke="#43566a"/><rect x="12" y="53" width="498" height="40" rx="16" fill="#1a2430" stroke="#43566a"/><text x="34" y="78" font-size="14" fill="#b9c8da" font-weight="400">Prepare</text><text x="156" y="78" font-size="14" fill="#b9c8da" font-weight="400">Preview</text><text x="278" y="78" font-size="14" fill="#b9c8da" font-weight="400">Print</text><text x="400" y="78" font-size="14" fill="#b9c8da" font-weight="400">Monitor</text><text x="540" y="79" font-size="13" fill="#b9c8da" font-weight="400">Home</text><text x="606" y="79" font-size="13" fill="#b9c8da" font-weight="400">Project</text><text x="684" y="79" font-size="13" fill="#b9c8da" font-weight="400">Multi-device</text><text x="796" y="79" font-size="13" fill="#b9c8da" font-weight="400">Filament</text><text x="887" y="79" font-size="13" fill="#b9c8da" font-weight="400">Calibration</text><text x="996" y="79" font-size="13" fill="#b9c8da" font-weight="400">Preferences</text><text x="1114" y="79" font-size="13" fill="#b9c8da" font-weight="400">More</text><text x="24" y="134" font-size="24" fill="#e8eff8" font-weight="700">Printer details</text><text x="24" y="157" font-size="12.5" fill="#b9c8da" font-weight="400">Static design reference. Illustrative controls are not interactive.</text><rect x="982" y="114" width="194" height="36" rx="18" fill="#1a2430" stroke="none"/><text x="996" y="137" font-size="13" fill="#b9c8da" font-weight="400">Dark / comfortable</text><rect x="24" y="180" width="736" height="510" rx="16" fill="#101720" stroke="#43566a"/><text x="44" y="211" font-size="16" fill="#e8eff8" font-weight="650">Live camera</text><rect x="44" y="234" width="696" height="344" rx="12" fill="#1a2430" stroke="none"/><text x="235" y="392" font-size="20" fill="#e8eff8" font-weight="600">Camera state belongs here</text><text x="217" y="421" font-size="12" fill="#b9c8da" font-weight="400">No captured printer image is used in this reference.</text><rect x="44" y="602" width="124" height="36" rx="18" fill="#1a2430" stroke="none"/><text x="58" y="625" font-size="13" fill="#b9c8da" font-weight="400">Connection</text><rect x="180" y="602" width="104" height="36" rx="18" fill="#1a2430" stroke="none"/><text x="194" y="625" font-size="13" fill="#b9c8da" font-weight="400">Play / stop</text><text x="44" y="665" font-size="13" fill="#b9c8da" font-weight="400">No physical action is represented as executed.</text><rect x="776" y="180" width="400" height="510" rx="16" fill="#101720" stroke="#43566a"/><text x="796" y="211" font-size="16" fill="#e8eff8" font-weight="650">Printer activity</text><text x="796" y="253" font-size="15" fill="#e8eff8" font-weight="600">Connection</text><rect x="796" y="270" width="360" height="8" rx="4" fill="#1a2430" stroke="none"/><text x="796" y="301" font-size="12" fill="#b9c8da" font-weight="400">Actual telemetry or explicit unavailable state</text><text x="796" y="342" font-size="15" fill="#