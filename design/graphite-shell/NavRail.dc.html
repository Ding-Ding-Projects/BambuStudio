<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Navigation rail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=swap" rel="stylesheet">
<style>
.ms{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;font-feature-settings:"liga";-webkit-font-smoothing:antialiased}
body{margin:0}
</style>
</helmet>
<nav aria-label="Workspaces" style="width: 88px; height: 100%; min-height: 852px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0; background: #0a0e0c; font-family: Roboto, system-ui, sans-serif">
  <sc-for list="{{items}}" as="it" hint-placeholder-count="8">
    <a href="#" aria-current="{{it.current}}" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0 6px; text-decoration: none; color: {{it.label}}; font-size: 11px; font-weight: 500">
      <span style="width: 56px; height: 32px; border-radius: 16px; display: grid; place-items: center; background: {{it.pill}}; color: {{it.icon}}"><span class="ms" aria-hidden="true">{{it.glyph}}</span></span>
      {{it.name}}
    </a>
  </sc-for>
  <div style="flex: 1"></div>
  <sc-for list="{{bottom}}" as="it" hint-placeholder-count="2">
    <a href="#" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0 6px; text-decoration: none; color: #a9b6ad; font-size: 11px; font-weight: 500">
      <span style="width: 56px; height: 32px; border-radius: 16px; display: grid; place-items: center"><span class="ms" aria-hidden="true">{{it.glyph}}</span></span>
      {{it.name}}
    </a>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","prepare","preview","device","multi","project","calibration","ink"],"default":"prepare"},"$preview":{"width":88,"height":852}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'prepare';
    const list = [
      ['home', 'Home', 'M3 11 12 4l9 7v9h-6v-6H9v6H3z'],
      ['prepare', 'Prepare', 'M12 2 3 7v10l9 5 9-5V7zM3 7l9 5 9-5M12 12v10'],
      ['preview', 'Preview', 'M12 3 2 8l10 5 10-5zM2 13l10 5 10-5M2 18l10 5 10-5'],
      ['device', 'Device', 'M4 4h16v12H4zM8 20h8M12 16v4'],
      ['multi', 'Fleet', 'M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z'],
      ['project', 'Project', 'M3 6h6l2 2h10v12H3z'],
      ['calibration', 'Calibrate', 'M4 20 20 4M7 17l2 2M10 14l2 2M13 11l2 2M16 8l2 2'],
      ['ink', 'Inks', 'M12 3c4 5 6 8 6 11a6 6 0 0 1-12 0c0-3 2-6 6-11z']
    ];
    const G = {"home": "home", "prepare": "view_in_ar", "preview": "layers", "device": "cast", "multi": "devices", "project": "folder_open", "calibration": "build", "ink": "palette"};
    return {
      items: list.map(([id, name, d]) => {
        const on = id === active;
        return { name, d, glyph: G[id], current: on ? 'page' : 'false', pill: on ? '#24342b' : 'transparent', icon: on ? '#9ff7bf' : '#a9b6ad', label: on ? '#e3ebe5' : '#a9b6ad' };
      }),
      bottom: [
        { name: 'Workspace', glyph: 'dashboard', d: 'M4 5h16v14H4zM4 9h16M9 9v10' },
        { name: 'Settings', glyph: 'settings', d: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 12l2-1-1-3-2 .2-1.5-1.5L16.7 4l-3-1-1 2h-1.4l-1-2-3 1 .2 2.7L6 8.2 4 8l-1 3 2 1v1.4l-2 1 1 3 2-.2 1.5 1.5L7.3 20l3 1 1-2h1.4l1 2 3-1-.2-2.7 1.5-1.5 2 .2 1-3-2-1z' }
      ]
    };
  }
}
</script>
</body>
</html>
