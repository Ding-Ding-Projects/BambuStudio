<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Navigation rail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=swap" rel="stylesheet">
<style>
.gs{--bg:#0e1311;--s0:#0a0e0c;--s1:#141a17;--s2:#18201c;--s3:#1f2823;--s4:#28322c;--ol:#34413a;--tx:#e3ebe5;--tx2:#a9b6ad;--tx3:#7c8a81;--pri:#6fdc98;--onpri:#00391c;--pric:#0f5130;--onpric:#9ff7bf;--sec:#24342b;--onsec:#cde9d6;--amb:#ffb870;--ambc:#3d2a14;--blu:#8ab4ff;--bluc:#1a2740;--errc:#93000a;--onerrc:#ffdad6;--err:#ffb4ab;
--d2:100ms;--d3:150ms;--d4:200ms;--d6:300ms;--d8:400ms;--d10:500ms;--d12:600ms;
--e-std:cubic-bezier(.2,0,0,1);--e-dec:cubic-bezier(0,0,0,1);--e-acc:cubic-bezier(.3,0,1,1);--e-emp-dec:cubic-bezier(.05,.7,.1,1);--e-emp-acc:cubic-bezier(.3,0,.8,.15);--e-spring:cubic-bezier(.34,1.45,.64,1);
font-family:Roboto,system-ui,sans-serif;color:var(--tx);background:var(--bg)}
.gs,.gs *{box-sizing:border-box}
.gs button,.gs select,.gs input{font:inherit;color:inherit}
.gs .ms{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;font-feature-settings:"liga";-webkit-font-smoothing:antialiased;flex-shrink:0}
.gs .mono{font-family:"Roboto Mono",monospace;font-variant-numeric:tabular-nums}
.gs .lbl{font-size:13px;font-weight:500;letter-spacing:.01em;color:var(--tx2)}
.gs .sub{font-size:12px;color:var(--tx2)}
.gs .row{display:flex;align-items:center;gap:10px}
.gs .grow{flex:1;min-width:0}
/* surfaces */
.gs .card{background:var(--s2);border-radius:28px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),0 1px 2px rgba(0,0,0,.4);transition:transform var(--d6) var(--e-spring),box-shadow var(--d4) var(--e-std),background-color var(--d4) var(--e-std)}
.gs .tile{background:var(--s1);border-radius:16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.03);transition:transform var(--d6) var(--e-spring),background-color var(--d4) var(--e-std),box-shadow var(--d4) var(--e-std)}
.gs .float{background:rgba(31,40,35,.84);-webkit-backdrop-filter:blur(18px) saturate(1.25);backdrop-filter:blur(18px) saturate(1.25);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 10px 28px rgba(0,0,0,.38)}
.gs .lift{cursor:pointer}
.gs .lift:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),0 10px 24px rgba(0,0,0,.4);background-color:var(--s3)}
.gs .lift:active{transform:translateY(0) scale(.985);transition-duration:var(--d2)}
/* state layers: hover 8 %, focus 10 %, press 12 % */
.gs .sl{position:relative;overflow:hidden;cursor:pointer;transition:background-color var(--d4) var(--e-std),transform var(--d4) var(--e-spring),box-shadow var(--d4) var(--e-std),border-radius var(--d4) var(--e-std)}
.gs .sl::after{content:"";position:absolute;inset:0;background:currentColor;opacity:0;pointer-events:none;transition:opacity var(--d3) var(--e-std)}
.gs .sl:hover::after{opacity:.08}.gs .sl:focus-visible::after{opacity:.1}.gs .sl:active::after{opacity:.12}
.gs .sl:active{transform:scale(.97)}
.gs button:focus-visible,.gs a:focus-visible,.gs select:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.gs .btn{height:48px;padding:0 22px;border-radius:24px;border:0;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:500;text-decoration:none;white-space:nowrap}
.gs .btn:hover{border-radius:16px}
.gs .btn:active{border-radius:14px}
.gs .btn-fill{background:var(--pri);color:var(--onpri);font-weight:700}
.gs .btn-tonal{background:var(--sec);color:var(--onsec)}
.gs .btn-out{background:transparent;color:var(--tx);box-shadow:inset 0 0 0 1px var(--ol)}
.gs .btn-text{background:transparent;color:var(--pri);padding:0 14px}
.gs .btn-danger{background:var(--errc);color:var(--onerrc)}
.gs .btn-s{height:36px;padding:0 16px;font-size:13px}
.gs .btn-xs{height:30px;padding:0 12px;font-size:12px}
.gs .ib{width:40px;height:40px;border-radius:14px;border:0;background:transparent;color:var(--tx2);display:inline-grid;place-items:center;padding:0}
.gs .ib:hover{color:var(--tx);border-radius:12px}
.gs .ib.on{background:var(--pri);color:var(--onpri)}
.gs .chip{height:32px;padding:0 14px;border-radius:16px;border:0;background:transparent;color:var(--tx2);box-shadow:inset 0 0 0 1px var(--ol);display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.gs .chip.on{background:var(--sec);color:var(--onsec);box-shadow:none;font-weight:500}
.gs .chip .ms{font-size:16px}
.gs .kbd{font-family:"Roboto Mono",monospace;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--s3);color:var(--tx2)}
/* segmented control with a sliding thumb */
.gs .seg{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);padding:4px;border-radius:999px;background:var(--s1)}
.gs .seg::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n));transform:translateX(calc(var(--i)*100%));background:var(--sec);border-radius:999px;transition:transform var(--d8) var(--e-spring)}
.gs .seg>button{position:relative;z-index:1;height:30px;border:0;background:transparent;color:var(--tx2);font-size:12px;border-radius:999px;transition:color var(--d4) var(--e-std)}
.gs .seg>button.on{color:var(--onsec);font-weight:500}
/* switch: knob grows on press, slides with a spring */
.gs .sw{width:48px;height:28px;border-radius:14px;border:0;padding:0;position:relative;background:var(--s4);box-shadow:inset 0 0 0 2px var(--ol);transition:background-color var(--d4) var(--e-std),box-shadow var(--d4) var(--e-std);flex-shrink:0}
.gs .sw i{position:absolute;left:6px;top:6px;width:16px;height:16px;border-radius:8px;background:var(--tx2);transition:transform var(--d6) var(--e-spring),width var(--d3) var(--e-std),height var(--d3) var(--e-std),top var(--d3) var(--e-std),background-color var(--d4) var(--e-std)}
.gs .sw[aria-checked=true]{background:var(--pri);box-shadow:none}
.gs .sw[aria-checked=true] i{transform:translateX(20px);width:20px;height:20px;top:4px;left:4px;background:var(--onpri)}
.gs .sw:active i{width:24px}
/* progress with shimmer */
.gs .prog{height:6px;border-radius:3px;background:var(--ol);position:relative;overflow:hidden}
.gs .prog>i{display:block;height:100%;border-radius:3px;background:var(--pri);position:relative;overflow:hidden;animation:gs-grow var(--d12) var(--e-emp-dec) both}
.gs .prog>i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:translateX(-100%);animation:gs-shimmer 1.8s var(--e-std) infinite}
.gs .dot{width:8px;height:8px;border-radius:4px;flex-shrink:0}
.gs .live{animation:gs-pulse 2s var(--e-std) infinite}
.gs .field{height:36px;border-radius:12px;background:var(--s3);border:0;box-shadow:inset 0 0 0 1px var(--ol);padding:0 10px;font-size:13px;color:var(--tx);transition:box-shadow var(--d4) var(--e-std)}
.gs .field:hover{box-shadow:inset 0 0 0 1px var(--tx3)}
.gs .field:focus{outline:none;box-shadow:inset 0 0 0 2px var(--pri)}
.gs .search{height:36px;border-radius:18px;background:var(--s3);display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;color:var(--tx2);font-size:13px;box-shadow:inset 0 0 0 1px transparent;transition:box-shadow var(--d4) var(--e-std)}
.gs .search:hover{box-shadow:inset 0 0 0 1px var(--ol)}
.gs .rx{font-family:"Roboto Mono",monospace;font-size:12px;height:24px;padding:0 8px;border-radius:12px;border:0;background:var(--s4);color:var(--tx2);cursor:pointer;transition:background-color var(--d4) var(--e-std),color var(--d4) var(--e-std)}
.gs .rx:hover{background:var(--sec);color:var(--onsec)}
/* motion keyframes (MD3 duration and easing tokens, see design/interface-motion.md) */
@keyframes gs-axis{from{opacity:0;transform:translateX(var(--dx,28px))}to{opacity:1;transform:none}}
@keyframes gs-rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes gs-fade{from{opacity:0}to{opacity:1}}
@keyframes gs-pop{from{opacity:0;transform:scale(.9) translateY(12px)}to{opacity:1;transform:none}}
@keyframes gs-grow{from{width:0}}
@keyframes gs-shimmer{to{transform:translateX(100%)}}
@keyframes gs-pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes gs-toast{from{opacity:0;transform:translateY(28px) scale(.96)}to{opacity:1;transform:none}}
@keyframes gs-ind{from{transform:translateY(calc(var(--idx)*-64px))}to{transform:none}}
@keyframes gs-layer{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.gs .screen{animation:gs-axis var(--d6) var(--e-emp-dec) both}
.gs .st>*{animation:gs-rise var(--d8) var(--e-emp-dec) both}
.gs .st>*:nth-child(1){animation-delay:0ms}.gs .st>*:nth-child(2){animation-delay:40ms}.gs .st>*:nth-child(3){animation-delay:80ms}.gs .st>*:nth-child(4){animation-delay:120ms}.gs .st>*:nth-child(5){animation-delay:160ms}.gs .st>*:nth-child(6){animation-delay:200ms}.gs .st>*:nth-child(7){animation-delay:240ms}.gs .st>*:nth-child(8){animation-delay:280ms}.gs .st>*:nth-child(9){animation-delay:320ms}.gs .st>*:nth-child(10){animation-delay:360ms}.gs .st>*:nth-child(n+11){animation-delay:400ms}
.gs .dlg{animation:gs-pop var(--d6) var(--e-emp-dec) both}
.gs .toast{animation:gs-toast var(--d6) var(--e-emp-dec) both;animation-delay:500ms}
.gs .scrim{animation:gs-fade var(--d4) var(--e-std) both}
.gs .scrubbing{animation:gs-layer var(--d8) var(--e-std) 1}
@media (prefers-reduced-motion:reduce){
  .gs *,.gs *::before,.gs *::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .gs .prog>i::after{display:none}
  .gs .live{opacity:1}
  .gs .lift:hover{transform:none}
}
body{margin:0}
.gs.rail{width:88px;height:100%;min-height:852px;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0;background:var(--s0)}
.gs .it{width:72px;height:60px;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0 0;text-decoration:none;color:var(--tx2);font-size:11px;font-weight:500;letter-spacing:.02em;transition:color var(--d4) var(--e-std)}
.gs .it .pill{width:56px;height:32px;border-radius:16px;display:grid;place-items:center;position:relative;transition:background-color var(--d4) var(--e-std),transform var(--d6) var(--e-spring)}
.gs .it:hover .pill{background:rgba(227,235,229,.08)}
.gs .it:active .pill{transform:scale(.92)}
.gs .it[aria-current=page]{color:var(--tx)}
.gs .it[aria-current=page] .pill{color:var(--onpri)}
.gs .ind{position:absolute;left:16px;top:calc(12px + var(--idx)*64px + 4px);width:56px;height:32px;border-radius:16px;background:var(--pri);z-index:0;transition:top var(--d8) var(--e-spring);animation:gs-ind var(--d8) var(--e-emp-dec) both}
.gs .it .nb{position:absolute;right:8px;top:0;width:9px;height:9px;border-radius:5px;background:var(--amb);box-shadow:0 0 0 2px var(--s0)}
@media (prefers-reduced-motion:reduce){.gs .ind{animation:none}}
</style>
</helmet>
<nav class="gs rail" aria-label="Workspace navigation" style="--idx: {{idx}}">
  <span class="ind" aria-hidden="true"></span>
  <sc-for list="{{items}}" as="it" hint-placeholder-count="9">
    <a href="#" class="it" aria-current="{{it.current}}"><span class="pill"><span class="ms" aria-hidden="true" style="font-size: 22px">{{it.glyph}}</span></span>{{it.name}}</a>
  </sc-for>
  <div style="flex: 1"></div>
  <sc-for list="{{bottom}}" as="it" hint-placeholder-count="2">
    <a href="#" class="it"><span class="pill"><span class="ms" aria-hidden="true" style="font-size: 22px">{{it.glyph}}</span></span>{{it.name}}</a>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","prepare","preview","device","multi","project","calibration","ink","print","tools"],"default":"prepare"},"$preview":{"width":88,"height":852}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'prepare';
    const list = [
      ['home', 'Home', 'home'],
      ['prepare', 'Prepare', 'view_in_ar'],
      ['preview', 'Preview', 'layers'],
      ['device', 'Device', 'cast'],
      ['multi', 'Multi-device', 'devices'],
      ['project', 'Project', 'folder_open'],
      ['calibration', 'Calibration', 'build'],
      ['ink', 'Ink', 'palette'],
      ['print', 'Print', 'print'],
      ['tools', 'Local tools', 'handyman']
    ];
    return {
      idx: Math.max(0, list.findIndex(([id]) => id === active)),
      items: list.map(([id, name, glyph]) => ({ name, glyph, current: id === active ? 'page' : 'false' })),
      bottom: [
        { name: 'Workspace', glyph: 'dashboard' },
        { name: 'Settings', glyph: 'settings' }
      ]
    };
  }
}
</script>
</body>
</html>
