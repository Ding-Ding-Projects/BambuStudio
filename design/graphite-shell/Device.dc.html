<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Device</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0e1311}
</style>
</helmet>
<div style="width: 100%; height: 900px; display: flex; flex-direction: column; background: #0e1311; color: #e3ebe5; font-family: Roboto, system-ui, sans-serif; overflow: hidden">
  <dc-import name="TitleBar" active="device" hint-size="100%,48px"></dc-import>
  <div style="flex: 1; display: flex; min-height: 0">
    <dc-import name="NavRail" active="device" hint-size="88px,852px"></dc-import>
    <main style="flex: 1; min-width: 0; padding: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: auto 1fr; gap: 12px; overflow: hidden">
      <section style="grid-column: span 2; border-radius: 24px; overflow: hidden; background: #000; position: relative; min-height: 420px">
        <svg width="100%" height="100%" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="position: absolute; inset: 0"><rect width="800" height="450" fill="#101512"></rect><polygon points="150,330 650,330 760,450 40,450" fill="#1b211d"></polygon><rect x="340" y="200" width="120" height="130" rx="6" fill="#2a8a52"></rect><rect x="370" y="150" width="60" height="22" rx="4" fill="#3a463f"></rect></svg>
        <div style="position: absolute; left: 16px; top: 16px; display: flex; gap: 8px">
          <span style="height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 14px; background: rgba(10,14,12,.8); font-size: 12px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #ff6b5e"></span>Live · 1080p</span>
          <span style="height: 28px; display: flex; align-items: center; padding: 0 10px; border-radius: 14px; background: rgba(10,14,12,.8); font-size: 12px">X1 Carbon · Studio</span>
        </div>
        <div style="position: absolute; left: 16px; right: 16px; bottom: 16px; padding: 14px 16px; border-radius: 18px; background: rgba(24,32,28,.92); display: flex; align-items: center; gap: 16px; flex-wrap: wrap">
          <div style="flex: 1; min-width: 240px">
            <div style="font-size: 14px; font-weight: 500">bracket_v3 · Plate 1</div>
            <div style="height: 6px; border-radius: 3px; background: #34413a; margin-top: 8px"><div style="width: 62%; height: 6px; border-radius: 3px; background: #6fdc98"></div></div>
            <div style="font-size: 12px; color: #a9b6ad; margin-top: 6px; font-family: 'Roboto Mono', monospace">62% · layer 132/212 · 38 m left</div>
          </div>
          <button style="height: 44px; padding: 0 18px; border-radius: 14px; border: 1px solid #34413a; background: transparent; color: #e3ebe5; font: inherit; font-size: 13px; font-weight: 500">Pause</button>
          <button style="height: 44px; padding: 0 18px; border-radius: 14px; border: 0; background: #93000a; color: #ffdad6; font: inherit; font-size: 13px; font-weight: 500">Stop</button>
        </div>
      </section>

      <section style="background: #18201c; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
        <div style="font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #a9b6ad; font-weight: 500">Temperatures</div>
        <sc-for list="{{temps}}" as="t" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: #141a17">
            <span style="width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: #3d2a14; color: #ffb870"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M14 14V4a2 2 0 1 0-4 0v10a4 4 0 1 0 4 0z"></path></svg></span>
            <span style="flex: 1; font-size: 13px">{{t.name}}</span>
            <span style="font-family: 'Roboto Mono', monospace; font-size: 18px">{{t.now}}</span>
            <span style="font-family: 'Roboto Mono', monospace; font-size: 12px; color: #a9b6ad">/ {{t.target}}</span>
          </div>
        </sc-for>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{fans}}" as="f" hint-placeholder-count="3">
            <div style="padding: 10px; border-radius: 14px; background: #141a17; text-align: center"><div style="font-size: 11px; color: #a9b6ad">{{f.name}}</div><div style="font-family: 'Roboto Mono', monospace; font-size: 15px">{{f.v}}</div></div>
          </sc-for>
        </div>
      </section>

      <section style="background: #18201c; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #a9b6ad; font-weight: 500">AMS · Unit A</span><span style="font-size: 12px; color: #a9b6ad">Humidity 18%</span></div>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
          <sc-for list="{{ams}}" as="a" hint-placeholder-count="4">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: 16px; background: #141a17; outline: {{a.ring}}">
              <span style="width: 40px; height: 56px; border-radius: 12px; background: {{a.c}}"></span>
              <span style="font-size: 12px">{{a.name}}</span>
              <span style="font-size: 11px; color: #a9b6ad; font-family: 'Roboto Mono', monospace">{{a.left}}</span>
            </div>
          </sc-for>
        </div>
      </section>

      <section style="background: #18201c; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
        <div style="font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #a9b6ad; font-weight: 500">Motion</div>
        <div style="display: grid; grid-template-columns: repeat(3, 48px); gap: 6px; justify-content: center">
          <span></span><button aria-label="Y plus" style="height: 48px; border-radius: 14px; border: 0; background: #1f2823; color: #e3ebe5">↑</button><span></span>
          <button aria-label="X minus" style="height: 48px; border-radius: 14px; border: 0; background: #1f2823; color: #e3ebe5">←</button><button aria-label="Home axes" style="height: 48px; border-radius: 14px; border: 0; background: #24342b; color: #9ff7bf">⌂</button><button aria-label="X plus" style="height: 48px; border-radius: 14px; border: 0; background: #1f2823; color: #e3ebe5">→</button>
          <span></span><button aria-label="Y minus" style="height: 48px; border-radius: 14px; border: 0; background: #1f2823; color: #e3ebe5">↓</button><span></span>
        </div>
        <div style="display: flex; gap: 6px; justify-content: center"><button style="height: 32px; padding: 0 12px; border-radius: 10px; border: 0; background: #24342b; color: #cde9d6; font: inherit; font-size: 12px">1 mm</button><button style="height: 32px; padding: 0 12px; border-radius: 10px; border: 0; background: transparent; color: #a9b6ad; font: inherit; font-size: 12px">10 mm</button></div>
      </section>

      <section style="background: #18201c; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
        <div style="font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #a9b6ad; font-weight: 500">Extras</div>
        <a href="Dialogs.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: #141a17; color: #e3ebe5; text-decoration: none; font-size: 13px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffb870" stroke-width="1.8" aria-hidden="true"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg><span style="flex: 1">Play a melody</span><span style="color: #a9b6ad">Idle only</span></a>
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: #141a17; font-size: 13px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8ab4ff" stroke-width="1.8" aria-hidden="true"><path d="M3 11 12 4l9 7v9H3z"></path></svg><span style="flex: 1">Hand over to Home Assistant</span><span style="color: #6fdc98">Ready</span></div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: #141a17; font-size: 13px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a9b6ad" stroke-width="1.8" aria-hidden="true"><path d="M12 3v3M12 18v3M5 12H2M22 12h-3"></path><circle cx="12" cy="12" r="5"></circle></svg><span style="flex: 1">Chamber light</span><span style="color: #6fdc98">On</span></div>
      </section>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      temps: [
        { name: 'Nozzle', now: '220°', target: '220°' },
        { name: 'Bed', now: '55°', target: '55°' },
        { name: 'Chamber', now: '34°', target: '—' }
      ],
      fans: [ { name: 'Part', v: '100%' }, { name: 'Aux', v: '40%' }, { name: 'Chamber', v: '20%' } ],
      ams: [
        { name: 'PLA', left: '82%', c: '#00ae42', ring: '2px solid #6fdc98' },
        { name: 'PLA', left: '40%', c: '#f2ead8', ring: 'none' },
        { name: 'PETG', left: '96%', c: '#3a3a3a', ring: 'none' },
        { name: 'TPU', left: '12%', c: '#ff7a1a', ring: 'none' }
      ]
    };
  }
}
</script>
</body>
</html>
