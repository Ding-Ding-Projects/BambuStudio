<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Preview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=swap" rel="stylesheet">
<style>
.ms{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;font-feature-settings:"liga";-webkit-font-smoothing:antialiased}
body{margin:0;background:#0e1311}
</style>
</helmet>
<div style="width: 100%; height: 900px; display: flex; flex-direction: column; background: #0e1311; color: #e3ebe5; font-family: Roboto, system-ui, sans-serif; overflow: hidden">
  <dc-import name="TitleBar" active="preview" hint-size="100%,48px"></dc-import>
  <div style="flex: 1; display: flex; min-height: 0">
    <dc-import name="NavRail" active="preview" hint-size="88px,852px"></dc-import>
    <main style="flex: 1; min-width: 0; position: relative; margin: 12px; border-radius: 24px; overflow: hidden; background: #141a17">
      <svg width="100%" height="100%" viewBox="0 0 1000 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="position: absolute; inset: 0">
        <polygon points="200,540 800,540 900,690 100,690" fill="#18201c" stroke="#34413a"></polygon>
        <sc-for list="{{layers}}" as="l" hint-placeholder-count="20">
          <rect x="{{l.x}}" y="{{l.y}}" width="{{l.w}}" height="9" rx="2" fill="{{l.c}}"></rect>
        </sc-for>
      </svg>

      <div style="position: absolute; left: 16px; top: 16px; display: flex; gap: 4px; padding: 6px; border-radius: 16px; background: #1f2823">
        <button style="height: 34px; padding: 0 14px; border-radius: 10px; border: 0; background: #24342b; color: #cde9d6; font: inherit; font-size: 13px; font-weight: 500">Line type</button>
        <button style="height: 34px; padding: 0 14px; border-radius: 10px; border: 0; background: transparent; color: #a9b6ad; font: inherit; font-size: 13px">Speed</button>
        <button style="height: 34px; padding: 0 14px; border-radius: 10px; border: 0; background: transparent; color: #a9b6ad; font: inherit; font-size: 13px">Ink</button>
        <button style="height: 34px; padding: 0 14px; border-radius: 10px; border: 0; background: transparent; color: #a9b6ad; font: inherit; font-size: 13px">Flow</button>
        <button style="height: 34px; padding: 0 14px; border-radius: 10px; border: 0; background: transparent; color: #a9b6ad; font: inherit; font-size: 13px">Temperature</button>
      </div>

      <aside style="position: absolute; right: 64px; top: 16px; width: 280px; padding: 16px; border-radius: 20px; background: #1f2823; display: flex; flex-direction: column; gap: 8px">
        <div style="font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #a9b6ad; font-weight: 500">Legend</div>
        <sc-for list="{{legend}}" as="g" hint-placeholder-count="7">
          <div style="display: flex; align-items: center; gap: 10px; font-size: 13px">
            <span style="width: 14px; height: 14px; border-radius: 4px; background: {{g.c}}"></span>
            <span style="flex: 1">{{g.name}}</span>
            <span style="font-family: 'Roboto Mono', monospace; font-size: 12px; color: #a9b6ad">{{g.t}}</span>
          </div>
        </sc-for>
        <div style="height: 1px; background: #34413a; margin: 6px 0"></div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; font-size: 12px">
          <div><div style="color: #a9b6ad">Total time</div><div style="font-family: 'Roboto Mono', monospace; font-size: 16px">1 h 42 m</div></div>
          <div><div style="color: #a9b6ad">Ink used</div><div style="font-family: 'Roboto Mono', monospace; font-size: 16px">38.6 g</div></div>
          <div><div style="color: #a9b6ad">Changes</div><div style="font-family: 'Roboto Mono', monospace; font-size: 16px">0</div></div>
          <div><div style="color: #a9b6ad">Layers</div><div style="font-family: 'Roboto Mono', monospace; font-size: 16px">212</div></div>
        </div>
      </aside>

      <div style="position: absolute; right: 16px; top: 16px; bottom: 96px; width: 36px; border-radius: 18px; background: #1f2823; display: flex; flex-direction: column; align-items: center; padding: 12px 0; box-sizing: border-box">
        <span style="font-family: 'Roboto Mono', monospace; font-size: 10px; color: #a9b6ad">212</span>
        <div style="flex: 1; width: 4px; margin: 8px 0; border-radius: 2px; background: #34413a; position: relative">
          <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 62%; border-radius: 2px; background: #6fdc98"></div>
          <div style="position: absolute; left: -8px; bottom: calc(62% - 10px); width: 20px; height: 20px; border-radius: 10px; background: #6fdc98; box-shadow: 0 0 0 4px #0f5130"></div>
        </div>
        <span style="font-family: 'Roboto Mono', monospace; font-size: 10px; color: #a9b6ad">1</span>
      </div>

      <div style="position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
        <div style="flex: 1; min-width: 300px; height: 52px; border-radius: 16px; background: #1f2823; display: flex; align-items: center; gap: 14px; padding: 0 16px">
          <button aria-label="Play moves" style="width: 32px; height: 32px; border-radius: 16px; border: 0; background: #6fdc98; color: #00391c; display: grid; place-items: center"><span class="ms" aria-hidden="true" style="font-size: 20px">play_arrow</span></button>
          <div style="flex: 1; height: 4px; border-radius: 2px; background: #34413a; position: relative"><div style="width: 40%; height: 4px; border-radius: 2px; background: #6fdc98"></div></div>
          <span style="font-family: 'Roboto Mono', monospace; font-size: 12px; color: #a9b6ad">Layer 132 · Z 26.40 mm</span>
        </div>
        <button style="height: 52px; padding: 0 22px; border-radius: 16px; border: 1px solid #34413a; background: #1f2823; color: #e3ebe5; font: inherit; font-size: 14px; font-weight: 500">Export G-code</button>
        <a href="Dialogs.dc.html" style="height: 52px; display: flex; align-items: center; padding: 0 26px; border-radius: 16px; background: #6fdc98; color: #00391c; text-decoration: none; font-size: 14px; font-weight: 700">Print plate</a>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const colors = ['#ffb870', '#6fdc98', '#8ab4ff', '#6fdc98', '#e3ebe5'];
    const layers = [];
    for (let i = 0; i < 22; i++) {
      const w = 200 - Math.abs(11 - i) * 4;
      layers.push({ x: 500 - w / 2, y: 640 - i * 10, w, c: i % 5 === 4 ? '#8ab4ff' : colors[i % 3] });
    }
    return {
      layers,
      legend: [
        { name: 'Outer wall', c: '#ffb870', t: '24 m' },
        { name: 'Inner wall', c: '#6fdc98', t: '31 m' },
        { name: 'Sparse infill', c: '#8ab4ff', t: '19 m' },
        { name: 'Top surface', c: '#e3ebe5', t: '8 m' },
        { name: 'Support', c: '#7c8a81', t: '6 m' },
        { name: 'Travel', c: '#34413a', t: 'n/a' }
      ]
    };
  }
}
</script>
</body>
</html>
