<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAN Drop Setup design demonstration</title>
<style>
:root{font:16px/1.5 system-ui,sans-serif;color:#19352e;background:#edf3ef;--surface:#fff;--line:#b7c8bf;--accent:#176a50}*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column}body.dark{color:#e0eee6;background:#15251f;--surface:#20362d;--line:#688577;--accent:#a0e6bf}header,footer{padding:14px 24px;background:var(--surface);flex:none}header{border-bottom:1px solid var(--line)}h1{font-size:23px;margin:0}h2{font-size:27px;line-height:1.25;margin:0 0 18px}p{max-width:66ch}small{display:block}label{display:block;margin:12px 0 5px;font-weight:600}select,input,button{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;max-width:100%}button{cursor:pointer;min-height:44px}button:disabled{opacity:.55;cursor:default}button.primary{background:var(--accent);color:#fff}.dark button.primary{color:#143c2b}:focus-visible{outline:3px solid #dc8900;outline-offset:3px}.demo{padding:8px 24px;background:#ffecbc;color:#493700;font-weight:600}.controls{display:flex;gap:12px;flex-wrap:wrap;padding:8px 24px}.controls label{font-size:13px;margin:0}.controls select{display:block;padding:4px 8px}.workspace{display:flex;min-height:0;flex:1}nav{padding:20px;width:205px;flex:none}nav ol{padding-left:24px}nav li{padding:9px 0}nav li[aria-current]{font-weight:750;color:var(--accent)}main{overflow:auto;min-width:0;flex:1;padding:24px;background:var(--surface);border-radius:22px 0 0 0}footer{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line)}footer span{flex:1}.panel{padding:16px;border:1px solid var(--line);border-radius:14px;margin:16px 0;overflow-wrap:anywhere}.warning{border-left:5px solid #b46a00}.fields{max-width:460px}.fields input,.fields select{width:100%}.tag{font-size:13px}.compact{display:none}@media(max-width:760px){nav{display:none}.compact{display:block}header,footer{padding:10px 16px}.demo,.controls{padding:6px 16px}main{padding:18px;border-radius:0}.controls{gap:8px}h2{font-size:23px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<body><header><h1>Bambu Studio LAN Drop Setup</h1><small id="identity"></small></header><div class="demo" id="banner"></div><div class="controls" id="controls"></div><div class="workspace"><nav aria-label="Setup steps"><ol id="rail"></ol></nav><main id="content" tabindex="-1"></main></div><footer><button id="back"></button><span id="position"></span><button class="primary" id="next"></button></footer>
<script>
'use strict';
const q=new URLSearchParams(location.search), allowed=(key,values,fallback)=>values.includes(q.get(key))?q.get(key):fallback;
let step=Math.min(5,Math.max(0,Number(q.get('step'))||0)),scenario=allowed('scenario',['existing','fresh','missing','conflict','failed','cancelled'],'existing'),lang=allowed('lang',['en','yue','both'],'en'),theme=allowed('theme',['light','dark'],'light');
const t=(en,yue)=>lang==='en'?en:lang==='yue'?yue:en+' / '+yue;
const titles=[['Discover your service','檢查現有服務'],['Check requirements','檢查所需工具'],['Configure hosting','設定託管'],['Review changes','確認更改'],['Start the service','啟動服務'],['Ready to send','可以傳送模型']];
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text)n.textContent=text;if(cls)n.className=cls;return n};
function panel(en,yue,warning=false){content.append(el('div',t(en,yue),'panel'+(warning?' warning':'')));}
function field(en,yue,value,type='text'){const wrap=el('div',null,'fields'),label=el('label',t(en,yue)),input=el('input');input.id='field-'+content.querySelectorAll('input').length;label.htmlFor=input.id;input.type=type;input.value=value;input.readOnly=true;wrap.append(label,input);content.append(wrap);}
const content=document.getElementById('content');
function render(focus=false){const restoreId=['scenario','lang','theme'].includes(document.activeElement.id)?document.activeElement.id:null;document.documentElement.lang=lang==='yue'?'yue-HK':'en';document.body.classList.toggle('dark',theme==='dark');document.getElementById('identity').textContent=t('Design reference • Service 1.0.1 • Production verification pending','設計參考 • 服務 1.0.1 • 正式版本尚待驗證');document.getElementById('banner').textContent=t('DEMONSTRATION ONLY. No installation, upload or service changes occur.','只供示範。唔會安裝、上載或更改服務。');
const controls=document.getElementById('controls');controls.replaceChildren();for(const [id,en,yue,items,value] of [['scenario','Demo scenario','示範情況',[['existing','Existing service','現有服務'],['fresh','Fresh setup','全新設定'],['missing','Missing prerequisite','缺少所需工具'],['conflict','Port conflict','連接埠衝突'],['failed','Health check failed','健康檢查失敗'],['cancelled','Cancelled, service retained','已取消，保留服務']],scenario],['lang','Language','語言',[['en','English','英文'],['yue','Cantonese','廣東話'],['both','Bilingual','雙語']],lang],['theme','Theme','外觀',[['light','Light','淺色'],['dark','Dark','深色']],theme]]){const label=el('label',t(en,yue)),select=el('select');select.id=id;label.htmlFor=id;for(const [v,a,b]of items){const o=el('option',t(a,b));o.value=v;select.append(o)}select.value=value;select.onchange=()=>{if(id==='scenario')scenario=select.value;if(id==='lang')lang=select.value;if(id==='theme')theme=select.value;render()};label.append(select);controls.append(label)}
const rail=document.getElementById('rail');rail.replaceChildren();titles.forEach((title,i)=>{const li=el('li',t(...title));if(i===step)li.setAttribute('aria-current','step');rail.append(li)});content.replaceChildren();content.append(el('small',t('Step '+(step+1)+' of 6','第 '+(step+1)+' 步，共 6 步'),'compact'));const heading=el('h2',t(...titles[step]));heading.tabIndex=-1;content.append(heading);
if(step===0){panel('Keep an existing service and its files, or prepare a separate fresh setup. Ownership is checked before any changes.','保留現有服務同檔案，或者準備獨立嘅全新設定。更改前會先核實服務擁有權。');panel(scenario==='fresh'?'Example: no existing owned service found.':'Example: existing service found. Queue and storage will be retained.',scenario==='fresh'?'示例：未搵到現有自有服務。':'示例：搵到現有服務。會保留佇列同儲存空間。');}
if(step===1){panel('Checks: Docker installation, engine readiness, Compose support and host compatibility.','檢查：Docker 安裝、引擎狀態、Compose 支援同主機相容性。');panel(scenario==='missing'?'Example: required runtime is missing. Supported installation requires verified packages; license acceptance and elevation consent remain yours.':'Example: requirements are available. This demonstration has not inspected this computer.',scenario==='missing'?'示例：缺少所需執行環境。安裝套件必須經過驗證；授權條款同提升權限確認由你親自處理。':'示例：所需工具齊備。呢個示範冇檢查你部電腦。',scenario==='missing');}
if(step===2){field('Station name (sample)','站台名稱（示例）','Model desk');field('Host port (sample)','主機連接埠（示例）','8833');panel(scenario==='fresh'?'Fresh storage: new dedicated volume by default. Optional folder must be new and empty; existing data is never migrated.':'Existing storage is preserved. This wizard does not relocate existing data.',scenario==='fresh'?'全新儲存：預設使用新嘅專用磁碟區。自選資料夾必須係新建兼空白，唔會搬移現有資料。':'保留現有儲存空間。呢個精靈唔會搬移現有資料。');panel('No key is needed: the drop box accepts the station without a key or credential.','唔需要密鑰：投遞箱毋須密鑰或憑證，站台已可使用。');if(scenario==='conflict')panel('Example: port is already occupied. Select an available port before continuing.','示例：連接埠已被佔用。請先選擇可用嘅連接埠。',true);}
if(step===3){panel('Image 1.0.1 is pinned to a reviewed immutable digest. Pull and start only the selected owned service. Preserve its volume and queue.','映像 1.0.1 綁定已審核嘅固定摘要。只下載同啟動所選自有服務，保留磁碟區同佇列。');panel('No public Internet exposure, automatic restart, license acceptance or elevation approval. Recheck the environment before applying.','唔會公開到互聯網、自動重新啟動、接受授權條款或批准提升權限。套用前會再次檢查環境。');}
if(step===4){const status=el('div',t('Simulated phase: checking LAN health. Production progress must come from the hosting backend.','模擬階段：檢查區域網絡健康狀態。正式進度必須由託管後端提供。'),'panel');status.setAttribute('role','status');content.append(status);if(scenario==='failed')panel('Example: LAN verification failed. Service data remains intact. Retry rechecks actual state before continuing.','示例：區域網絡驗證失敗。服務資料保持完整。重試前會重新檢查實際狀態。',true);if(scenario==='cancelled')panel('Example: cancellation completed after service startup. The service remains running; no volume was removed.','示例：服務啟動後先完成取消。服務仍然運作，冇移除任何磁碟區。',true);const cancel=el('button',t('Simulate cancellation','模擬取消'));cancel.onclick=()=>{scenario='cancelled';render(true)};content.append(cancel);}
if(step===5){panel('Example result only: service is running and a LAN address passed checks from this host. Another device has not been tested.','只係結果示例：服務運作中，區域網絡地址通過本機檢查。尚未喺另一部裝置測試。');panel('Production actions: Open sender page, Copy verified URL, Recheck health, View logs. No real endpoint is supplied by this demonstration.','正式操作：開啟傳送頁面、複製已驗證網址、重新檢查健康狀態、查看記錄。呢個示範唔提供真實端點。');}
const blocked=(step===1&&scenario==='missing')||(step===2&&scenario==='conflict')||(step===4&&['failed','cancelled'].includes(scenario));document.getElementById('back').textContent=t('Back','上一步');document.getElementById('back').disabled=step===0||(step===4&&!['failed','cancelled'].includes(scenario));document.getElementById('next').textContent=step===5?t('Restart demonstration','重新示範'):step===3?t('Simulate start','模擬啟動'):step===4?t('Simulate successful reconciliation','模擬完成狀態核實'):t('Next','下一步');document.getElementById('next').disabled=blocked;document.getElementById('position').textContent=blocked?t('Resolve the selected demo condition to continue.','請先更改示範情況先可以繼續。'):t('Demonstration '+(step+1)+'/6','示範 '+(step+1)+'/6');if(focus)heading.focus();else if(restoreId)document.getElementById(restoreId).focus();}
document.getElementById('back').onclick=()=>{if(step===4&&!['failed','cancelled'].includes(scenario))return;step=Math.max(0,step-1);render(true)};document.getElementById('next').onclick=()=>{if(document.getElementById('next').disabled)return;step=(step+1)%6;render(true)};render();
</script></body></html>
