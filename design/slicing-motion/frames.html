<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Plate slicing motion references</title><style>
:root{color-scheme:dark;font:16px system-ui;background:#10141b;color:#f3f4fa}body{max-width:1000px;margin:auto;padding:24px}h1{font-size:28px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:18px}article{background:#202936;border-radius:16px;padding:16px}h2{font-size:18px;margin:0}canvas{width:100%;height:auto}label{display:inline-block;margin:0 12px 16px 0}p{line-height:1.5}small{color:#bcc9d8}
</style><h1>Slicing motion references</h1><p>Design study using a stepped test part. Production scenes render the actual plate. The accents are decorative.</p><label>Accent <input id="accent" type="color" value="#a6ceff"></label><label><input id="motion" type="checkbox" checked> Animate</label><main></main><script>
const states=['Plate needs slicing','Reslicing from print setup','Slicing'];
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
for(const still of [false,true]) for(const [id,title] of states.entries()){
 const a=document.createElement('article');a.innerHTML='<h2>'+title+'</h2><small>'+(still?'Reduced motion':'Motion reference')+'</small><canvas width="400" height="230" aria-label="'+title+' with stepped reference geometry"></canvas>';document.querySelector('main').append(a);
 const ctx=a.querySelector('canvas').getContext('2d');
 function draw(ms){
  const t=still||reduced.matches||!motion.checked?0.65:ms/1000;
  ctx.clearRect(0,0,400,230);
  const poly=(points,color)=>{ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fillStyle=color;ctx.fill()};
  for(let i=0;i<3;i++){const y=158-i*24,r=84-i*18;
   poly([[200-r,y],[200,y+25],[200,y+45],[200-r,y+20]],'#6085a5');poly([[200,y+25],[200+r,y],[200+r,y+20],[200,y+45]],'#416180');poly([[200-r,y],[200,y-25],[200+r,y],[200,y+25]],'#aac7db')}
  ctx.strokeStyle=accent.value;ctx.lineWidth=4;const line=(x,y,X,Y)=>{ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(X,Y);ctx.stroke()};
  if(id===0){let p=12+9*(1-Math.cos(t*2*Math.PI/2.4));for(const x of [-1,1])for(const y of [-1,1]){let X=200+x*(180-p),Y=115+y*(104-p);line(X,Y,X-x*48,Y);line(X,Y,X,Y-y*36)}}
  if(id===1){let f=t/2.1%1,k=f<.35?f/.35:(1-f)/.65;for(const d of [-1,1]){let x=200+d*(170-75*k*k);line(x,42,x-d*34,115);line(x-d*34,115,x,188);line(x+d*17,57,x-d*8,115)}}
  if(id===2){let s=t/3.2%1;line(73,181-123*s,327,181-123*s);ctx.beginPath();ctx.ellipse(200,183,72+64*s,7+12*s,0,0,2*Math.PI);ctx.stroke()}
  requestAnimationFrame(draw)
 }requestAnimationFrame(draw)
}
</script></html>
